                <!-- Categorías de Parámetros iteradas en Array -->
                <template x-for="cat in categoriesList" :key="cat.name">
                    <div class="space-y-3">
                        <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                            <span x-text="cat.name"></span>
                        </h2>

                        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                            <div class="divide-y divide-slate-700/50">
                                <template x-for="param in cat.items" :key="param.id || param.clave">
                                    <div class="p-5 flex items-center justify-between hover:bg-slate-700/20 transition-colors">
                                        <div class="flex-1 pr-4">
                                            <div class="flex items-center gap-2">
                                                <h3 class="text-sm font-bold text-white font-mono" x-text="param.clave"></h3>
                                                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-700 uppercase" x-text="param.tipo"></span>
                                            </div>
                                            <p class="text-xs text-slate-400 mt-1" x-text="param.descripcion || 'Sin descripción'"></p>
                                        </div>
                                        <div class="flex items-center gap-4">
                                            <span class="inline-block bg-slate-900 border border-slate-700 text-amber-400 px-4 py-1.5 rounded-lg text-sm font-mono font-bold" x-text="param.valor"></span>
                                            <button @click="openEditModal(param)" title="Editar Parámetro" class="p-2 text-slate-400 hover:text-amber-400 rounded-lg hover:bg-slate-700 transition-colors">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                
                <div x-show="!loading && categoriesList.length === 0" class="bg-slate-800 rounded-xl p-12 text-center text-slate-500 border border-slate-700">
                    No se encontraron parámetros con el criterio de búsqueda.
                </div>

                <div x-show="loading" class="bg-slate-800 rounded-xl p-12 text-center text-slate-400 border border-slate-700">
                    Cargando parámetros del sistema...
                </div>
            </div>

            <!-- Create / Edit Modal -->
            <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="closeModal()"></div>
                    
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-lg sm:w-full border border-slate-700 z-10">
                        <form @submit.prevent="saveParam">
                            <div class="px-6 pt-6 pb-4">
                                <h3 class="text-lg font-bold text-white mb-4" x-text="isCreating ? 'Nuevo Parámetro' : 'Editar Parámetro'"></h3>
                                
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Clave Única *</label>
                                        <input type="text" x-model="form.clave" :readonly="!isCreating" required placeholder="ej: empresa_nit, impuesto_porcentaje" 
                                            class="w-full border rounded-lg px-3 py-2 text-sm font-mono outline-none"
                                            :class="!isCreating ? 'border-slate-700 bg-slate-900 text-slate-400 cursor-not-allowed' : 'border-slate-600 bg-slate-700 text-white focus:border-amber-500'">
                                    </div>

                                    <div class="grid grid-cols-2 gap-4" x-show="isCreating">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Categoría</label>
                                            <select x-model="form.categoria" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="general">General</option>
                                                <option value="impuestos">Impuestos</option>
                                                <option value="operacion">Operación</option>
                                                <option value="inventario">Inventario</option>
                                                <option value="reportes">Reportes</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Dato</label>
                                            <select x-model="form.tipo" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="string">Texto (String)</option>
                                                <option value="number">Numérico (Number)</option>
                                                <option value="boolean">Booleano (True/False)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Descripción</label>
                                        <textarea x-model="form.descripcion" rows="2" placeholder="Describe el propósito de este parámetro..." class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none"></textarea>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Valor *</label>
                                        <input x-show="form.tipo !== 'boolean'" type="text" x-model="form.valor" required placeholder="Valor del parámetro..." class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none font-mono font-bold">
                                        <select x-show="form.tipo === 'boolean'" x-model="form.valor" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                            <option value="true">Verdadero (True)</option>
                                            <option value="false">Falso (False)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-slate-900/60 px-6 py-4 flex flex-row-reverse gap-3 border-t border-slate-700">
                                <button type="submit" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-semibold hover:bg-amber-600 transition-colors">Guardar Parámetro</button>
                                <button type="button" @click="closeModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600 transition-colors">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg px-4 py-3 shadow-lg border text-sm font-medium bg-green-900/90 border-green-500 text-green-200" style="display: none;">
                <p x-text="toast.message"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js?v=4"></script>
    <script src="../assets/js/api.js?v=4"></script>
    <script src="../assets/js/auth.js?v=4"></script>
    <script src="../assets/js/perfil.js?v=1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (!user) { window.location.href = '../index.html'; return; }
            if (!window.auth.hasRole('admin')) {
                window.location.href = 'dashboard.html';
                return;
            }

            const rolNombre = user.rol_nombre || user.rol || '';
            const fullName = `${user.nombre} ${user.apellido || ''}`.trim();
            document.querySelectorAll('#user-name, .user-display-name').forEach(el => el.textContent = fullName);
            document.querySelectorAll('#user-rol, .user-display-rol').forEach(el => el.textContent = rolNombre);

            const rol = rolNombre.toLowerCase();
            if (rol === 'admin' || rol === 'cajero') {
                document.querySelectorAll('.nav-cajero, .nav-admin').forEach(el => el.style.display = 'flex');
            }
            if (rol === 'admin') {
                document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('div.nav-admin').forEach(el => el.style.display = 'block');
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('parametrosPage', () => ({
                parametros: [],
                searchQuery: '',
                loading: true,
                showModal: false,
                isCreating: false,
                form: { id: null, clave: '', descripcion: '', valor: '', tipo: 'string', categoria: 'general' },
                toast: { show: false, message: '' },

                async init() { 
                    await this.fetchParametros(); 
                },
                
                get categoriesList() {
                    const q = (this.searchQuery || '').toLowerCase();
                    const filtered = this.parametros.filter(p => 
                        (p.clave || '').toLowerCase().includes(q) || 
                        (p.descripcion || '').toLowerCase().includes(q) ||
                        (p.valor || '').toLowerCase().includes(q)
                    );

                    const groups = {};
                    filtered.forEach(p => {
                        const cat = (p.categoria || 'General').toUpperCase();
                        if (!groups[cat]) groups[cat] = { name: cat, items: [] };
                        groups[cat].items.push(p);
                    });
                    return Object.values(groups);
                },

                async fetchParametros() {
                    this.loading = true;
                    try {
                        const res = await window.api.get('/api/parametros');
                        this.parametros = res?.data || [];
                    } catch (e) {
                        console.error("Error cargando parámetros:", e);
                        this.parametros = [];
                    } finally {
                        this.loading = false;
                    }
                },

                openCreateModal() {
                    this.isCreating = true;
                    this.form = { id: null, clave: '', descripcion: '', valor: '', tipo: 'string', categoria: 'general' };
                    this.showModal = true;
                },

                openEditModal(param) {
                    this.isCreating = false;
                    this.form = { ...param };
                    this.showModal = true;
                },

                closeModal() {
                    this.showModal = false;
                },

                async saveParam() {
                    try {
                        if (this.isCreating) {
                            await window.api.post('/api/parametros', this.form);
                            this.showToast('Parámetro creado exitosamente');
                        } else {
                            await window.api.put(`/api/parametros/${this.form.clave}`, this.form);
                            this.showToast('Parámetro actualizado exitosamente');
                        }
                        await this.fetchParametros();
                        this.closeModal();
                    } catch (e) {
                        console.error(e);
                        alert(e.message || 'Error al guardar parámetro');
                    }
                },

                showToast(message) {
                    this.toast = { show: true, message };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
