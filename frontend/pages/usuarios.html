<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 900: '#0B0F19', 800: '#141C2E', 700: '#222E46', 600: '#334466', 400: '#94A3B8', 300: '#CBD5E1' },
                        amber: { 500: '#7C3AED', 600: '#6D28D9', 400: '#A855F7', 300: '#C4B5FD' },
                        lune: { bg: '#0B0F19', card: '#141C2E', border: '#222E46', blue: '#2A40FF', purple: '#7C3AED', violet: '#A855F7', lavender: '#C4B5FD' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true }">

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex flex-shrink-0">
        <div class="h-16 flex items-center px-4 border-b border-slate-700 gap-3 overflow-hidden">
            <img src="../assets/Logos/Isotipo.png" alt="Bar Mune" class="h-8 w-8 object-contain flex-shrink-0" />
            <img x-show="sidebarOpen" src="../assets/Logos/Horizontal_Fondo_Transparente_Positivo.png" alt="Bar Mune" class="h-6 w-auto object-contain" />
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2" id="sidebar-nav">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Dashboard</span>
            </a>
            <a href="ordenes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Órdenes</span>
            </a>
            <a href="pagos.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Pagos</span>
            </a>
            <a href="inventario.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Inventario</span>
            </a>
            <a href="stock-alertas.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Alertas Stock</span>
            </a>
            <a href="reportes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Reportes</span>
            </a>

            <div class="nav-admin border-t border-slate-700 my-2" style="display:none"></div>

            <a href="usuarios.html" class="flex items-center px-3 py-2.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Usuarios</span>
            </a>
            <a href="sedes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Sedes</span>
            </a>
            <a href="parametros.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.572-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Parámetros</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-xl font-semibold text-white">Gestión de Usuarios</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p id="user-name" class="text-sm font-medium text-white"></p>
                    <p id="user-rol" class="text-xs text-slate-400 capitalize"></p>
                </div>
                <button onclick="window.auth.logout()" title="Cerrar sesión" class="p-2 text-slate-400 hover:text-red-400 transition-colors rounded-lg hover:bg-red-400/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="usuariosPage()" x-init="init()">
            
            <!-- Toolbar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div class="flex flex-wrap items-center gap-3">
                    <input type="text" x-model="searchQuery" placeholder="Buscar por nombre o email..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500 w-64">
                    
                    <select x-model="filterSede" id="filter-user-sede" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="" class="bg-slate-800 text-white">Todas las Sedes</option>
                    </select>

                    <select x-model="filterRol" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="" class="bg-slate-800 text-white">Todos los Roles</option>
                        <option value="admin" class="bg-slate-800 text-white">Administrador</option>
                        <option value="cajero" class="bg-slate-800 text-white">Cajero</option>
                        <option value="mesero" class="bg-slate-800 text-white">Mesero</option>
                    </select>
                </div>
                <button @click="openModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center shadow-sm">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Nuevo Usuario
                </button>
            </div>

            <!-- Table -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-900/50 text-slate-400">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Usuario</th>
                                <th class="px-6 py-4 font-semibold">Email</th>
                                <th class="px-6 py-4 font-semibold">Rol</th>
                                <th class="px-6 py-4 font-semibold">Sede</th>
                                <th class="px-6 py-4 font-semibold">Estado</th>
                                <th class="px-6 py-4 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            <template x-for="usuario in filteredUsuarios" :key="usuario.id">
                                <tr class="hover:bg-slate-700/20 transition-colors">
                                    <td class="px-6 py-4">
                                        <div class="flex items-center">
                                            <div class="w-9 h-9 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs" x-text="getInitials(usuario.nombre, usuario.apellido)"></div>
                                            <div class="ml-3">
                                                <p class="font-medium text-white" x-text="`${usuario.nombre} ${usuario.apellido || ''}`.trim()"></p>
                                                <p class="text-xs text-slate-400" x-text="usuario.telefono || ''"></p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-slate-300" x-text="usuario.email"></td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold uppercase" 
                                            :class="{
                                                'bg-purple-500/20 text-purple-300 border border-purple-500/30': (usuario.rol || usuario.rol_nombre) === 'admin',
                                                'bg-amber-500/20 text-amber-300 border border-amber-500/30': (usuario.rol || usuario.rol_nombre) === 'cajero',
                                                'bg-blue-500/20 text-blue-300 border border-blue-500/30': (usuario.rol || usuario.rol_nombre) === 'mesero'
                                            }" x-text="usuario.rol || usuario.rol_nombre"></span>
                                    </td>
                                    <td class="px-6 py-4 text-slate-300" x-text="usuario.sede_nombre || getSedeName(usuario.sede_id)"></td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-medium" 
                                            :class="usuario.estado === 'activo' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'" 
                                            x-text="usuario.estado === 'activo' ? 'Activo' : 'Inactivo'"></span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button @click="openModal(usuario)" title="Editar" class="text-slate-400 hover:text-amber-400 transition-colors mr-3 p-1 rounded hover:bg-slate-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                        </button>
                                        <button @click="confirmDelete(usuario)" title="Desactivar" class="text-slate-400 hover:text-red-400 transition-colors p-1 rounded hover:bg-slate-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="filteredUsuarios.length === 0">
                                <td colspan="6" class="px-6 py-12 text-center text-slate-500">No se encontraron usuarios registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Form (Crear / Editar) -->
            <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="closeModal()"></div>
                    
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-lg sm:w-full border border-slate-700 z-10">
                        <form @submit.prevent="saveUsuario">
                            <div class="px-6 pt-6 pb-4">
                                <h3 class="text-lg font-bold text-white mb-4" x-text="form.id ? 'Editar Usuario' : 'Nuevo Usuario'"></h3>
                                
                                <div class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Nombre *</label>
                                            <input type="text" x-model="form.nombre" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Apellido</label>
                                            <input type="text" x-model="form.apellido" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                    </div>
                                    
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Email *</label>
                                            <input type="email" x-model="form.email" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Teléfono</label>
                                            <input type="text" x-model="form.telefono" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">
                                            Contraseña <span x-show="form.id" class="text-slate-400 font-normal">(Dejar en blanco para conservar actual)</span><span x-show="!form.id">*</span>
                                        </label>
                                        <input type="password" x-model="form.password" :required="!form.id" placeholder="Mínimo 6 caracteres" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Rol *</label>
                                            <select x-model="form.rol_id" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="admin" class="bg-slate-800 text-white">Administrador</option>
                                                <option value="cajero" class="bg-slate-800 text-white">Cajero</option>
                                                <option value="mesero" class="bg-slate-800 text-white">Mesero</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Sede *</label>
                                            <select x-model="form.sede_id" id="modal-user-sede" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="" class="bg-slate-800 text-white">Seleccione una sede</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Estado</label>
                                        <select x-model="form.estado" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                            <option value="activo" class="bg-slate-800 text-white">Activo</option>
                                            <option value="inactivo" class="bg-slate-800 text-white">Inactivo</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-slate-900/60 px-6 py-4 flex flex-row-reverse gap-3 border-t border-slate-700">
                                <button type="submit" :disabled="saving" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium hover:bg-amber-600 transition-colors flex items-center gap-2">
                                    <svg x-show="saving" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <span>Guardar</span>
                                </button>
                                <button type="button" @click="closeModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600 transition-colors">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Modal Confirmación Eliminación -->
            <div x-show="showDeleteModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="showDeleteModal = false"></div>
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-md sm:w-full border border-slate-700 z-10 p-6">
                        <h3 class="text-lg font-bold text-white mb-2">Desactivar Usuario</h3>
                        <p class="text-sm text-slate-400 mb-6">
                            ¿Estás seguro de que deseas desactivar al usuario <span class="text-white font-semibold" x-text="usuarioToDelete?.nombre"></span>? No podrá iniciar sesión en el sistema.
                        </p>
                        <div class="flex justify-end gap-3">
                            <button type="button" @click="showDeleteModal = false" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600">Cancelar</button>
                            <button type="button" @click="deleteUsuario()" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700">Desactivar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg px-4 py-3 shadow-lg border text-sm font-medium"
                :class="toast.type === 'success' ? 'bg-green-900/90 border-green-500 text-green-200' : 'bg-red-900/90 border-red-500 text-red-200'" style="display: none;">
                <p x-text="toast.message"></p>
            </div>

        </main>
    </div>

    <script src="../assets/js/config.js?v=3"></script>
    <script src="../assets/js/api.js?v=3"></script>
    <script src="../assets/js/auth.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (!user) { window.location.href = '../index.html'; return; }
            if (!window.auth.hasRole('admin')) {
                window.location.href = 'dashboard.html';
                return;
            }

            const rolNombre = user.rol_nombre || user.rol || '';
            document.getElementById('user-name').textContent = `${user.nombre} ${user.apellido || ''}`.trim();
            document.getElementById('user-rol').textContent = rolNombre;

            const rol = rolNombre.toLowerCase();
            if (rol === 'admin' || rol === 'cajero') {
                document.querySelectorAll('.nav-cajero, .nav-admin').forEach(el => el.style.display = 'flex');
            }
            if (rol === 'admin') {
                document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('div.nav-admin').forEach(el => el.style.display = 'block');
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('usuariosPage', () => ({
                usuarios: [],
                sedes: [],
                searchQuery: '',
                filterSede: '',
                filterRol: '',
                showModal: false,
                showDeleteModal: false,
                usuarioToDelete: null,
                saving: false,
                form: {
                    id: null, nombre: '', apellido: '', email: '', password: '', telefono: '', rol_id: 'mesero', sede_id: '', estado: 'activo'
                },
                toast: { show: false, message: '', type: 'success' },

                async init() {
                    await this.fetchSedes();
                    await this.fetchUsuarios();
                    this.populateSedesSelects();
                },

                get filteredUsuarios() {
                    return this.usuarios.filter(u => {
                        const searchTarget = `${u.nombre || ''} ${u.apellido || ''} ${u.email || ''}`.toLowerCase();
                        const matchesSearch = searchTarget.includes(this.searchQuery.toLowerCase());
                        const matchesSede = this.filterSede === '' || String(u.sede_id) === String(this.filterSede);
                        const userRoleStr = (u.rol || u.rol_nombre || '').toLowerCase();
                        const matchesRol = this.filterRol === '' || userRoleStr === this.filterRol.toLowerCase();
                        return matchesSearch && matchesSede && matchesRol;
                    });
                },

                populateSedesSelects() {
                    const fSede = document.getElementById('filter-user-sede');
                    if (fSede) {
                        fSede.innerHTML = '<option value="" class="bg-slate-800 text-white">Todas las Sedes</option>' +
                            this.sedes.map(s => `<option value="${s.id}" class="bg-slate-800 text-white">${s.nombre}</option>`).join('');
                    }

                    const mSede = document.getElementById('modal-user-sede');
                    if (mSede) {
                        mSede.innerHTML = '<option value="" class="bg-slate-800 text-white">Seleccione una sede</option>' +
                            this.sedes.map(s => `<option value="${s.id}" class="bg-slate-800 text-white">${s.nombre}</option>`).join('');
                        mSede.value = this.form.sede_id || '';
                    }
                },

                async fetchSedes() {
                    try {
                        const res = await window.api.get('/api/sedes');
                        this.sedes = res?.data || [];
                        if (this.sedes.length > 0 && !this.form.sede_id) {
                            this.form.sede_id = this.sedes[0].id;
                        }
                    } catch (e) {
                        console.error("Error cargando sedes:", e);
                        this.sedes = [];
                    }
                },

                async fetchUsuarios() {
                    try {
                        const res = await window.api.get('/api/usuarios');
                        this.usuarios = res?.data || [];
                    } catch (e) {
                        console.error("Error cargando usuarios:", e);
                        this.usuarios = [];
                    }
                },

                getInitials(nombre, apellido) {
                    const n = (nombre || '').charAt(0);
                    const a = (apellido || '').charAt(0);
                    return `${n}${a}`.toUpperCase() || 'U';
                },

                getSedeName(id) {
                    const s = this.sedes.find(item => String(item.id) === String(id));
                    return s ? s.nombre : 'Sin sede';
                },

                openModal(usuario = null) {
                    if (usuario) {
                        this.form = {
                            id: usuario.id,
                            nombre: usuario.nombre || '',
                            apellido: usuario.apellido || '',
                            email: usuario.email || '',
                            telefono: usuario.telefono || '',
                            password: '',
                            rol_id: usuario.rol || usuario.rol_nombre || 'mesero',
                            sede_id: usuario.sede_id || (this.sedes[0]?.id || ''),
                            estado: usuario.estado || 'activo'
                        };
                    } else {
                        this.form = {
                            id: null,
                            nombre: '',
                            apellido: '',
                            email: '',
                            telefono: '',
                            password: '',
                            rol_id: 'mesero',
                            sede_id: this.sedes[0]?.id || '',
                            estado: 'activo'
                        };
                    }
                    this.showModal = true;
                    this.$nextTick(() => {
                        this.populateSedesSelects();
                    });
                },

                closeModal() {
                    this.showModal = false;
                },

                async saveUsuario() {
                    const mSede = document.getElementById('modal-user-sede');
                    if (mSede && mSede.value) this.form.sede_id = mSede.value;

                    if (!this.form.sede_id) {
                        alert('Por favor selecciona una sede');
                        return;
                    }

                    this.saving = true;
                    try {
                        if (this.form.id) {
                            const payload = { ...this.form };
                            if (!payload.password) delete payload.password;
                            await window.api.put(`/api/usuarios/${this.form.id}`, payload);
                            this.showToast('Usuario actualizado correctamente', 'success');
                        } else {
                            await window.api.post('/api/usuarios', this.form);
                            this.showToast('Usuario creado correctamente', 'success');
                        }
                        await this.fetchUsuarios();
                        this.closeModal();
                    } catch (e) {
                        this.showToast(e.message || 'Error al guardar el usuario', 'error');
                    } finally {
                        this.saving = false;
                    }
                },

                confirmDelete(usuario) {
                    this.usuarioToDelete = usuario;
                    this.showDeleteModal = true;
                },

                async deleteUsuario() {
                    if (!this.usuarioToDelete) return;
                    try {
                        await window.api.delete(`/api/usuarios/${this.usuarioToDelete.id}`);
                        this.showToast('Usuario desactivado exitosamente', 'success');
                        await this.fetchUsuarios();
                    } catch (e) {
                        this.showToast(e.message || 'Error al desactivar usuario', 'error');
                    } finally {
                        this.showDeleteModal = false;
                        this.usuarioToDelete = null;
                    }
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
