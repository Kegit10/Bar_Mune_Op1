<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Bar Mune</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
                        amber: { 500: '#F59E0B', 600: '#D97706' }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="../assets/css/app.css">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true, userRole: window.auth ? window.auth.getUser()?.rol?.toLowerCase() : '' }">
    
    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex">
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <svg class="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path>
            </svg>
            <span x-show="sidebarOpen" class="ml-2 font-bold text-xl tracking-wide whitespace-nowrap">Bar Mune</span>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="dashboard.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Dashboard</span>
            </a>
            <a href="usuarios.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 bg-amber-500/10 text-amber-500 border-r-2 border-amber-500">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Usuarios</span>
            </a>
            <a href="sedes.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Sedes</span>
            </a>
            <a href="parametros.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Parámetros</span>
            </a>
            <a href="inventario.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Inventario</span>
            </a>
            <a href="stock-alertas.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Alertas Stock</span>
            </a>
            <a href="ordenes.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Órdenes</span>
            </a>
            <a href="pagos.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Pagos</span>
            </a>
            <a href="reportes.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white">
                <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium">Reportes</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10">
            <div class="flex items-center">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="ml-4 text-xl font-semibold text-white">Usuarios</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm text-slate-300"></span>
                <button onclick="window.auth.logout()" class="text-slate-400 hover:text-red-400 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="usuariosPage()">
            
            <!-- Toolbar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div class="flex flex-wrap items-center gap-4">
                    <input type="text" x-model="searchQuery" placeholder="Buscar por nombre o email..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500 w-64">
                    <select x-model="filterSede" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
                        <option value="">Todas las Sedes</option>
                        <template x-for="sede in sedes" :key="sede.id">
                            <option :value="sede.id" x-text="sede.nombre"></option>
                        </template>
                    </select>
                    <select x-model="filterRol" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
                        <option value="">Todos los Roles</option>
                        <option value="admin">Administrador</option>
                        <option value="cajero">Cajero</option>
                        <option value="mesero">Mesero</option>
                    </select>
                </div>
                <button @click="openModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center shadow-sm">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Nuevo Usuario
                </button>
            </div>

            <!-- Table -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-900/50 text-slate-400">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Usuario</th>
                                <th class="px-6 py-4 font-semibold">Email</th>
                                <th class="px-6 py-4 font-semibold">Rol</th>
                                <th class="px-6 py-4 font-semibold">Sede</th>
                                <th class="px-6 py-4 font-semibold">Estado</th>
                                <th class="px-6 py-4 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            <template x-for="usuario in filteredUsuarios" :key="usuario.id">
                                <tr class="hover:bg-slate-700/20 transition-colors">
                                    <td class="px-6 py-4">
                                        <div class="flex items-center">
                                            <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center font-bold text-xs" x-text="getInitials(usuario.nombre, usuario.apellido)"></div>
                                            <div class="ml-3">
                                                <p class="font-medium text-white" x-text="`${usuario.nombre} ${usuario.apellido}`"></p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-slate-300" x-text="usuario.email"></td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-medium" 
                                            :class="{
                                                'bg-purple-500/10 text-purple-400': usuario.rol === 'admin',
                                                'bg-amber-500/10 text-amber-400': usuario.rol === 'cajero',
                                                'bg-blue-500/10 text-blue-400': usuario.rol === 'mesero'
                                            }" x-text="usuario.rol"></span>
                                    </td>
                                    <td class="px-6 py-4 text-slate-300" x-text="getSedeName(usuario.sede_id)"></td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-medium" 
                                            :class="usuario.estado === 'activo' ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'" 
                                            x-text="usuario.estado === 'activo' ? 'Activo' : 'Inactivo'"></span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button @click="openModal(usuario)" class="text-slate-400 hover:text-amber-400 transition-colors mr-3">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                        </button>
                                        <button @click="confirmDelete(usuario)" class="text-slate-400 hover:text-red-400 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="filteredUsuarios.length === 0">
                                <td colspan="6" class="px-6 py-8 text-center text-slate-500">No se encontraron usuarios.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Form -->
            <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                    <div x-show="showModal" x-transition.opacity class="fixed inset-0 bg-slate-900/80 transition-opacity" @click="closeModal()" aria-hidden="true"></div>
                    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                    
                    <div x-show="showModal" x-transition.scale class="inline-block align-bottom bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-700">
                        <form @submit.prevent="saveUsuario">
                            <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                <h3 class="text-lg leading-6 font-medium text-white mb-4" id="modal-title" x-text="form.id ? 'Editar Usuario' : 'Nuevo Usuario'"></h3>
                                
                                <div class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-slate-300">Nombre</label>
                                            <input type="text" x-model="form.nombre" required class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-slate-300">Apellido</label>
                                            <input type="text" x-model="form.apellido" required class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-slate-300">Email</label>
                                        <input type="email" x-model="form.email" required class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-slate-300">Contraseña <span x-show="form.id" class="text-xs text-slate-500">(Opcional para mantener actual)</span></label>
                                        <input type="password" x-model="form.password" :required="!form.id" class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-slate-300">Rol</label>
                                            <select x-model="form.rol_id" required class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                                <option value="admin">Administrador</option>
                                                <option value="cajero">Cajero</option>
                                                <option value="mesero">Mesero</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-slate-300">Sede</label>
                                            <select x-model="form.sede_id" required class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                                <template x-for="sede in sedes" :key="sede.id">
                                                    <option :value="sede.id" x-text="sede.nombre"></option>
                                                </template>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-slate-300">Estado</label>
                                        <select x-model="form.estado" class="mt-1 block w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm">
                                            <option value="activo">Activo</option>
                                            <option value="inactivo">Inactivo</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-slate-900/50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-slate-700">
                                <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-amber-500 text-base font-medium text-white hover:bg-amber-600 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                                    Guardar
                                </button>
                                <button type="button" @click="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-slate-600 shadow-sm px-4 py-2 bg-slate-700 text-base font-medium text-slate-300 hover:bg-slate-600 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Delete Confirmation -->
            <div x-show="showDeleteModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                    <div x-show="showDeleteModal" class="fixed inset-0 bg-slate-900/80 transition-opacity" @click="showDeleteModal = false"></div>
                    <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                    <div x-show="showDeleteModal" class="inline-block align-bottom bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-700">
                        <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <div class="sm:flex sm:items-start">
                                <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-500/10 sm:mx-0 sm:h-10 sm:w-10">
                                    <svg class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                </div>
                                <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                                    <h3 class="text-lg leading-6 font-medium text-white">Eliminar Usuario</h3>
                                    <div class="mt-2">
                                        <p class="text-sm text-slate-400">¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-slate-900/50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-slate-700">
                            <button type="button" @click="deleteUsuario()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">Eliminar</button>
                            <button type="button" @click="showDeleteModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-slate-600 shadow-sm px-4 py-2 bg-slate-700 text-base font-medium text-slate-300 hover:bg-slate-600 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg p-4 shadow-lg border"
                :class="toast.type === 'success' ? 'bg-green-500/10 border-green-500/50 text-green-400' : 'bg-red-500/10 border-red-500/50 text-red-400'" style="display: none;">
                <p x-text="toast.message" class="text-sm font-medium"></p>
            </div>

        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // Guard for admin only
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.auth.hasRole('admin')) {
                window.location.href = 'dashboard.html';
                return;
            }
            const user = window.auth.getUser();
            if (user) {
                document.getElementById('user-info').textContent = `${user.nombre} (${user.rol})`;
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('usuariosPage', () => ({
                usuarios: [],
                sedes: [],
                searchQuery: '',
                filterSede: '',
                filterRol: '',
                showModal: false,
                showDeleteModal: false,
                usuarioToDelete: null,
                form: {
                    id: null, nombre: '', apellido: '', email: '', password: '', rol_id: 'mesero', sede_id: '', estado: 'activo'
                },
                toast: { show: false, message: '', type: 'success' },

                async init() {
                    await this.fetchSedes();
                    await this.fetchUsuarios();
                },

                get filteredUsuarios() {
                    return this.usuarios.filter(u => {
                        const matchesSearch = `${u.nombre} ${u.apellido} ${u.email}`.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesSede = this.filterSede === '' || u.sede_id == this.filterSede;
                        const matchesRol = this.filterRol === '' || u.rol === this.filterRol;
                        return matchesSearch && matchesSede && matchesRol;
                    });
                },

                async fetchSedes() {
                    try {
                        // Mock fallback or real API
                        const res = await window.api.get('/api/sedes').catch(() => [{id: 1, nombre: 'Sede Principal'}]);
                        this.sedes = res || [];
                        if (this.sedes.length > 0) this.form.sede_id = this.sedes[0].id;
                    } catch (e) { console.error(e); }
                },

                async fetchUsuarios() {
                    try {
                        const res = await window.api.get('/api/usuarios').catch(() => [
                            {id: 1, nombre: 'Admin', apellido: 'User', email: 'admin@barmune.com', rol: 'admin', sede_id: 1, estado: 'activo'},
                            {id: 2, nombre: 'Juan', apellido: 'Pérez', email: 'juan@barmune.com', rol: 'mesero', sede_id: 1, estado: 'activo'}
                        ]);
                        this.usuarios = res || [];
                    } catch (e) { console.error(e); }
                },

                getInitials(nombre, apellido) {
                    return `${nombre?.charAt(0) || ''}${apellido?.charAt(0) || ''}`.toUpperCase();
                },

                getSedeName(id) {
                    const sede = this.sedes.find(s => s.id == id);
                    return sede ? sede.nombre : 'Desconocida';
                },

                openModal(usuario = null) {
                    if (usuario) {
                        this.form = { ...usuario, password: '', rol_id: usuario.rol };
                    } else {
                        this.form = { id: null, nombre: '', apellido: '', email: '', password: '', rol_id: 'mesero', sede_id: this.sedes[0]?.id || '', estado: 'activo' };
                    }
                    this.showModal = true;
                },

                closeModal() {
                    this.showModal = false;
                },

                async saveUsuario() {
                    try {
                        if (this.form.id) {
                            // Update
                            const payload = { ...this.form };
                            if (!payload.password) delete payload.password; // Don't send empty pass
                            await window.api.put(`/api/usuarios/${this.form.id}`, payload).catch(() => {});
                            this.showToast('Usuario actualizado correctamente', 'success');
                        } else {
                            // Create
                            await window.api.post('/api/usuarios', this.form).catch(() => {});
                            this.showToast('Usuario creado correctamente', 'success');
                        }
                        await this.fetchUsuarios();
                        this.closeModal();
                    } catch (e) {
                        this.showToast('Error al guardar el usuario', 'error');
                    }
                },

                confirmDelete(usuario) {
                    this.usuarioToDelete = usuario;
                    this.showDeleteModal = true;
                },

                async deleteUsuario() {
                    if (!this.usuarioToDelete) return;
                    try {
                        await window.api.delete(`/api/usuarios/${this.usuarioToDelete.id}`).catch(() => {});
                        this.showToast('Usuario eliminado', 'success');
                        await this.fetchUsuarios();
                    } catch (e) {
                        this.showToast('Error al eliminar', 'error');
                    } finally {
                        this.showDeleteModal = false;
                        this.usuarioToDelete = null;
                    }
                },

                showToast(message, type) {
                    this.toast = { show: true, message, type };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
