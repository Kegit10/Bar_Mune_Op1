<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 900: '#0B0F19', 800: '#141C2E', 700: '#222E46', 600: '#334466', 400: '#94A3B8', 300: '#CBD5E1' },
                        amber: { 500: '#7C3AED', 600: '#6D28D9', 400: '#A855F7', 300: '#C4B5FD' },
                        lune: { bg: '#0B0F19', card: '#141C2E', border: '#222E46', blue: '#2A40FF', purple: '#7C3AED', violet: '#A855F7', lavender: '#C4B5FD' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true }">

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex flex-shrink-0">
        <div class="h-16 flex items-center px-4 border-b border-slate-700 gap-3 overflow-hidden">
            <img src="../assets/Logos/Isotipo.png" alt="Bar Mune" class="h-8 w-8 object-contain flex-shrink-0" />
            <img x-show="sidebarOpen" src="../assets/Logos/Horizontal_Fondo_Transparente_Positivo" alt="Bar Mune" class="h-6 w-auto object-contain" />
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2" id="sidebar-nav">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Dashboard</span>
            </a>
            <a href="ordenes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Órdenes</span>
            </a>
            <a href="pagos.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Pagos</span>
            </a>
            <a href="inventario.html" class="flex items-center px-3 py-2.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Inventario</span>
            </a>
            <a href="stock-alertas.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Alertas Stock</span>
            </a>
            <a href="reportes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Reportes</span>
            </a>

            <div class="nav-admin border-t border-slate-700 my-2" style="display:none"></div>

            <a href="usuarios.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Usuarios</span>
            </a>
            <a href="sedes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Sedes</span>
            </a>
            <a href="parametros.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Parámetros</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-xl font-semibold text-white">Inventario de Productos</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p id="user-name" class="text-sm font-medium text-white"></p>
                    <p id="user-rol" class="text-xs text-slate-400 capitalize"></p>
                </div>
                <button onclick="window.auth.logout()" title="Cerrar sesión" class="p-2 text-slate-400 hover:text-red-400 transition-colors rounded-lg hover:bg-red-400/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="inventarioPage()" x-init="init()">
            <!-- Toolbar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div class="flex flex-wrap items-center gap-3">
                    <input type="text" x-model="searchQuery" placeholder="Buscar por código o nombre..." class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500 w-64">
                    
                    <!-- Filter Categoria -->
                    <select x-model="filterCategoria" id="filter-cat-select" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="" class="bg-slate-800 text-white">Todas las Categorías</option>
                    </select>

                    <!-- Filter Sede -->
                    <select x-model="filterSede" id="filter-sede-select" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="" class="bg-slate-800 text-white">Todas las Sedes</option>
                    </select>
                </div>
                
                <div class="flex gap-2">
                    <button @click="openCatModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-600 flex items-center">
                        + Nueva Categoría
                    </button>
                    <button @click="openModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center shadow-sm">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Nuevo Producto
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-900/50 text-slate-400">
                            <tr>
                                <th class="px-6 py-4 font-semibold">Código</th>
                                <th class="px-6 py-4 font-semibold">Producto</th>
                                <th class="px-6 py-4 font-semibold">Categoría</th>
                                <th class="px-6 py-4 font-semibold">Sede</th>
                                <th class="px-6 py-4 font-semibold text-right">Precio Costo</th>
                                <th class="px-6 py-4 font-semibold text-right">Precio Venta</th>
                                <th class="px-6 py-4 font-semibold text-right">Stock Actual</th>
                                <th class="px-6 py-4 font-semibold">Estado</th>
                                <th class="px-6 py-4 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            <template x-for="prod in filteredProductos" :key="prod.id">
                                <tr class="hover:bg-slate-700/20 transition-colors">
                                    <td class="px-6 py-4 font-mono font-semibold text-amber-500" x-text="prod.codigo"></td>
                                    <td class="px-6 py-4">
                                        <p class="font-medium text-white" x-text="prod.nombre"></p>
                                        <p class="text-xs text-slate-400" x-text="prod.descripcion || ''"></p>
                                    </td>
                                    <td class="px-6 py-4 text-slate-300" x-text="prod.categoria_nombre || getCategoriaName(prod.categoria_id)"></td>
                                    <td class="px-6 py-4 text-slate-300" x-text="prod.sede_nombre || getSedeName(prod.sede_id)"></td>
                                    <td class="px-6 py-4 text-right text-slate-400" x-text="formatCurrency(prod.precio_costo || prod.costo)"></td>
                                    <td class="px-6 py-4 text-right font-semibold text-white" x-text="formatCurrency(prod.precio_venta || prod.precio)"></td>
                                    <td class="px-6 py-4 text-right">
                                        <span class="inline-flex items-center gap-1.5 font-bold" :class="(prod.stock_actual || prod.stock) <= prod.stock_minimo ? 'text-red-400' : 'text-green-400'">
                                            <span x-text="prod.stock_actual || prod.stock || 0"></span>
                                            <span class="text-xs text-slate-500 font-normal" x-text="'/ ' + prod.stock_minimo"></span>
                                        </span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium uppercase"
                                            :class="prod.estado === 'activo' ? 'bg-green-500/20 text-green-300 border border-green-500/30' : 'bg-red-500/20 text-red-300 border border-red-500/30'"
                                            x-text="prod.estado"></span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button @click="openModal(prod)" title="Editar" class="text-slate-400 hover:text-amber-400 transition-colors mr-3 p-1 rounded hover:bg-slate-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                        </button>
                                        <button @click="confirmDelete(prod)" title="Desactivar" class="text-slate-400 hover:text-red-400 transition-colors p-1 rounded hover:bg-slate-700">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="filteredProductos.length === 0">
                                <td colspan="9" class="px-6 py-12 text-center text-slate-500">No se encontraron productos registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Producto -->
            <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="closeModal()"></div>
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-xl sm:w-full border border-slate-700 z-10">
                        <form @submit.prevent="saveProducto">
                            <div class="px-6 pt-6 pb-4">
                                <h3 class="text-lg font-bold text-white mb-4" x-text="form.id ? 'Editar Producto' : 'Nuevo Producto'"></h3>
                                <div class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Código *</label>
                                            <input type="text" x-model="form.codigo" placeholder="Ej: CER-01, LIC-01" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none font-mono uppercase">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Nombre *</label>
                                            <input type="text" x-model="form.nombre" placeholder="Ej: Corona 330ml, Tequila Don Julio" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Descripción</label>
                                        <textarea x-model="form.descripcion" rows="2" placeholder="Presentación, características..." class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none"></textarea>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <div class="flex justify-between items-center mb-1">
                                                <label class="block text-xs font-medium text-slate-300">Categoría *</label>
                                                <button type="button" @click="openCatModal()" class="text-[11px] text-amber-400 hover:underline">+ Crear</button>
                                            </div>
                                            <select x-model="form.categoria_id" id="modal-cat-select" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="" class="bg-slate-800 text-white">Seleccione Categoría</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Sede *</label>
                                            <select x-model="form.sede_id" id="modal-sede-select" required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="" class="bg-slate-800 text-white">Seleccione Sede</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Precio Costo ($)</label>
                                            <input type="number" x-model.number="form.precio_costo" min="0" step="100" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Precio Venta ($) *</label>
                                            <input type="number" x-model.number="form.precio_venta" required min="0" step="100" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none font-semibold">
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Stock Inicial</label>
                                            <input type="number" x-model.number="form.stock_actual" min="0" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Stock Mínimo</label>
                                            <input type="number" x-model.number="form.stock_minimo" min="0" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-300 mb-1">Estado</label>
                                            <select x-model="form.estado" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                                <option value="activo" class="bg-slate-800 text-white">Activo</option>
                                                <option value="inactivo" class="bg-slate-800 text-white">Inactivo</option>
                                                <option value="agotado" class="bg-slate-800 text-white">Agotado</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-slate-900/60 px-6 py-4 flex flex-row-reverse gap-3 border-t border-slate-700">
                                <button type="submit" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium hover:bg-amber-600 transition-colors">Guardar</button>
                                <button type="button" @click="closeModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600 transition-colors">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Modal Crear Categoría Rápida -->
            <div x-show="showCatModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="showCatModal = false"></div>
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:max-w-md sm:w-full border border-slate-700 z-10 p-6">
                        <h3 class="text-lg font-bold text-white mb-3">Nueva Categoría</h3>
                        <form @submit.prevent="saveCategoria">
                            <div class="space-y-3 mb-5">
                                <div>
                                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre *</label>
                                    <input type="text" x-model="catForm.nombre" placeholder="Ej: Cervezas, Licores, Snacks..." required class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-300 mb-1">Descripción</label>
                                    <input type="text" x-model="catForm.descripcion" placeholder="Descripción opcional" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                </div>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button type="button" @click="showCatModal = false" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium hover:bg-amber-600">Crear Categoría</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg px-4 py-3 shadow-lg border text-sm font-medium bg-green-900/90 border-green-500 text-green-200" style="display: none;">
                <p x-text="toast.message"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js?v=4"></script>
    <script src="../assets/js/api.js?v=4"></script>
    <script src="../assets/js/auth.js?v=4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (!user) { window.location.href = '../index.html'; return; }
            if (!window.auth.hasRole('admin', 'cajero')) { window.location.href = 'dashboard.html'; return; }

            const rolNombre = user.rol_nombre || user.rol || '';
            document.getElementById('user-name').textContent = `${user.nombre} ${user.apellido || ''}`.trim();
            document.getElementById('user-rol').textContent = rolNombre;

            const rol = rolNombre.toLowerCase();
            if (rol === 'admin' || rol === 'cajero') {
                document.querySelectorAll('.nav-cajero, .nav-admin').forEach(el => el.style.display = 'flex');
            }
            if (rol === 'admin') {
                document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('div.nav-admin').forEach(el => el.style.display = 'block');
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('inventarioPage', () => ({
                productos: [],
                categorias: [],
                sedes: [],
                searchQuery: '',
                filterCategoria: '',
                filterSede: '',
                showModal: false,
                showCatModal: false,
                catForm: { nombre: '', descripcion: '' },
                form: {
                    id: null, codigo: '', nombre: '', descripcion: '', precio_costo: 0, precio_venta: 0, stock_actual: 0, stock_minimo: 5, categoria_id: '', sede_id: '', estado: 'activo'
                },
                toast: { show: false, message: '' },

                async init() {
                    await this.fetchCategorias();
                    await this.fetchSedes();
                    await this.fetchProductos();
                    this.populateAllSelects();
                },

                get filteredProductos() {
                    return this.productos.filter(p => {
                        const target = `${p.codigo || ''} ${p.nombre || ''}`.toLowerCase();
                        const matchesSearch = target.includes(this.searchQuery.toLowerCase());
                        const matchesCat = this.filterCategoria === '' || String(p.categoria_id) === String(this.filterCategoria);
                        const matchesSede = this.filterSede === '' || String(p.sede_id) === String(this.filterSede);
                        return matchesSearch && matchesCat && matchesSede;
                    });
                },

                populateAllSelects() {
                    // Populate filter cat
                    const fCat = document.getElementById('filter-cat-select');
                    if (fCat) {
                        fCat.innerHTML = '<option value="" class="bg-slate-800 text-white">Todas las Categorías</option>' +
                            this.categorias.map(c => `<option value="${c.id}" class="bg-slate-800 text-white">${c.nombre}</option>`).join('');
                    }

                    // Populate filter sede
                    const fSede = document.getElementById('filter-sede-select');
                    if (fSede) {
                        fSede.innerHTML = '<option value="" class="bg-slate-800 text-white">Todas las Sedes</option>' +
                            this.sedes.map(s => `<option value="${s.id}" class="bg-slate-800 text-white">${s.nombre}</option>`).join('');
                    }

                    // Populate modal cat
                    const mCat = document.getElementById('modal-cat-select');
                    if (mCat) {
                        mCat.innerHTML = '<option value="" class="bg-slate-800 text-white">Seleccione Categoría</option>' +
                            this.categorias.map(c => `<option value="${c.id}" class="bg-slate-800 text-white">${c.nombre}</option>`).join('');
                        mCat.value = this.form.categoria_id || '';
                    }

                    // Populate modal sede
                    const mSede = document.getElementById('modal-sede-select');
                    if (mSede) {
                        mSede.innerHTML = '<option value="" class="bg-slate-800 text-white">Seleccione Sede</option>' +
                            this.sedes.map(s => `<option value="${s.id}" class="bg-slate-800 text-white">${s.nombre}</option>`).join('');
                        mSede.value = this.form.sede_id || '';
                    }
                },

                async fetchCategorias() {
                    try {
                        const res = await window.api.get('/api/categorias');
                        this.categorias = res?.data || [];
                    } catch (e) {
                        this.categorias = [];
                    }
                },

                async fetchSedes() {
                    try {
                        const res = await window.api.get('/api/sedes');
                        this.sedes = res?.data || [];
                        const user = window.auth.getUser();
                        if (!window.auth.hasRole('admin') && user?.sede_id) {
                            this.filterSede = user.sede_id;
                            this.form.sede_id = user.sede_id;
                        }
                    } catch (e) {
                        this.sedes = [];
                    }
                },

                async fetchProductos() {
                    try {
                        const res = await window.api.get('/api/productos');
                        this.productos = res?.data || [];
                    } catch (e) {
                        this.productos = [];
                    }
                },

                getCategoriaName(id) {
                    const c = this.categorias.find(item => String(item.id) === String(id));
                    return c ? c.nombre : 'General';
                },

                getSedeName(id) {
                    const s = this.sedes.find(item => String(item.id) === String(id));
                    return s ? s.nombre : 'Sede Principal';
                },

                openCatModal() {
                    this.catForm = { nombre: '', descripcion: '' };
                    this.showCatModal = true;
                },

                async saveCategoria() {
                    try {
                        const res = await window.api.post('/api/categorias', this.catForm);
                        this.showToast('Categoría creada exitosamente');
                        await this.fetchCategorias();
                        this.populateAllSelects();
                        if (res?.data?.id) {
                            this.form.categoria_id = res.data.id;
                            const mCat = document.getElementById('modal-cat-select');
                            if (mCat) mCat.value = res.data.id;
                        }
                        this.showCatModal = false;
                    } catch (e) {
                        alert(e.message || 'Error al crear la categoría');
                    }
                },

                openModal(prod = null) {
                    if (prod) {
                        this.form = {
                            id: prod.id,
                            codigo: prod.codigo || '',
                            nombre: prod.nombre || '',
                            descripcion: prod.descripcion || '',
                            precio_costo: prod.precio_costo || prod.costo || 0,
                            precio_venta: prod.precio_venta || prod.precio || 0,
                            stock_actual: prod.stock_actual || prod.stock || 0,
                            stock_minimo: prod.stock_minimo || 5,
                            categoria_id: prod.categoria_id || '',
                            sede_id: prod.sede_id || '',
                            estado: prod.estado || 'activo'
                        };
                    } else {
                        this.form = {
                            id: null,
                            codigo: '',
                            nombre: '',
                            descripcion: '',
                            precio_costo: 0,
                            precio_venta: 0,
                            stock_actual: 0,
                            stock_minimo: 5,
                            categoria_id: this.categorias[0]?.id || '',
                            sede_id: this.sedes[0]?.id || '',
                            estado: 'activo'
                        };
                    }
                    this.showModal = true;
                    this.$nextTick(() => {
                        this.populateAllSelects();
                    });
                },

                closeModal() { this.showModal = false; },

                async saveProducto() {
                    // Sync values from select if needed
                    const mCat = document.getElementById('modal-cat-select');
                    const mSede = document.getElementById('modal-sede-select');
                    if (mCat && mCat.value) this.form.categoria_id = mCat.value;
                    if (mSede && mSede.value) this.form.sede_id = mSede.value;

                    if (!this.form.categoria_id) {
                        alert('Por favor selecciona una categoría');
                        return;
                    }
                    if (!this.form.sede_id) {
                        alert('Por favor selecciona una sede');
                        return;
                    }

                    try {
                        if (this.form.id) {
                            await window.api.put(`/api/productos/${this.form.id}`, this.form);
                            this.showToast('Producto actualizado correctamente');
                        } else {
                            await window.api.post('/api/productos', this.form);
                            this.showToast('Producto creado exitosamente');
                        }
                        await this.fetchProductos();
                        this.closeModal();
                    } catch (e) {
                        alert(e.message || 'Error al guardar el producto');
                    }
                },

                async confirmDelete(prod) {
                    if (!confirm(`¿Desactivar producto "${prod.nombre}"?`)) return;
                    try {
                        await window.api.delete(`/api/productos/${prod.id}`);
                        this.showToast('Producto desactivado');
                        await this.fetchProductos();
                    } catch (e) {
                        alert(e.message || 'Error al desactivar');
                    }
                },

                formatCurrency(val) {
                    const num = parseFloat(val) || 0;
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(num);
                },

                showToast(message) {
                    this.toast = { show: true, message };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
