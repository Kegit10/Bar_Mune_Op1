<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { slate: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' }, amber: { 500: '#F59E0B', 600: '#D97706' } } } } }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true, userRole: window.auth ? window.auth.getUser()?.rol?.toLowerCase() : '' }">
    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex">
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <svg class="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>
            <span x-show="sidebarOpen" class="ml-2 font-bold text-xl tracking-wide whitespace-nowrap">Bar Mune</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="dashboard.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span x-show="sidebarOpen">Dashboard</span></a>
            <a href="reportes.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 bg-amber-500/10 text-amber-500 border-r-2 border-amber-500"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><span x-show="sidebarOpen">Reportes</span></a>
            <a href="dashboard.html" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg><span x-show="sidebarOpen">Volver</span></a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-10">
            <h1 class="text-xl font-semibold text-white ml-4">Reportes</h1>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" x-data="reportesPage()">
            
            <!-- Tabs -->
            <div class="border-b border-slate-700 mb-6">
                <nav class="-mb-px flex space-x-8">
                    <button @click="activeTab = 'ventas'" :class="activeTab === 'ventas' ? 'border-amber-500 text-amber-500' : 'border-transparent text-slate-400 hover:text-white hover:border-slate-300'" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm">Reporte de Ventas</button>
                    <button @click="activeTab = 'inventario'" :class="activeTab === 'inventario' ? 'border-amber-500 text-amber-500' : 'border-transparent text-slate-400 hover:text-white hover:border-slate-300'" class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm">Reporte de Inventario</button>
                </nav>
            </div>

            <!-- Filters -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 mb-6 flex flex-wrap gap-4 items-end shadow-sm">
                <div x-show="activeTab === 'ventas'">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Desde</label>
                    <input type="date" x-model="filters.desde" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:ring-amber-500 outline-none">
                </div>
                <div x-show="activeTab === 'ventas'">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Hasta</label>
                    <input type="date" x-model="filters.hasta" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Sede</label>
                    <select x-model="filters.sede_id" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:ring-amber-500 outline-none w-48">
                        <option value="">Todas</option>
                        <template x-for="sede in sedes" :key="sede.id"><option :value="sede.id" x-text="sede.nombre"></option></template>
                    </select>
                </div>
                <button @click="generarReporte()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-4 py-2 rounded-lg transition-colors border border-slate-600">Vista Previa</button>
                
                <div class="ml-auto flex gap-2">
                    <button class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-sm flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Descargar Excel
                    </button>
                    <button class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-4 py-2 rounded-lg transition-colors border border-slate-600 flex items-center">
                        CSV
                    </button>
                </div>
            </div>

            <!-- Stats summary -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <template x-for="stat in summaryStats" :key="stat.label">
                    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-sm flex flex-col justify-center">
                        <p class="text-sm font-medium text-slate-400" x-text="stat.label"></p>
                        <p class="text-2xl font-bold text-white mt-1" x-text="stat.value"></p>
                    </div>
                </template>
            </div>

            <!-- Table Preview -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-900/80 text-slate-400 sticky top-0 z-10 shadow-sm backdrop-blur">
                            <tr x-show="activeTab === 'ventas'">
                                <th class="px-6 py-4 font-semibold">Fecha</th>
                                <th class="px-6 py-4 font-semibold"># Orden</th>
                                <th class="px-6 py-4 font-semibold">Mesa</th>
                                <th class="px-6 py-4 font-semibold">Mesero</th>
                                <th class="px-6 py-4 font-semibold text-right">Subtotal</th>
                                <th class="px-6 py-4 font-semibold text-right">Propina</th>
                                <th class="px-6 py-4 font-semibold text-right">Total</th>
                                <th class="px-6 py-4 font-semibold">Método Pago</th>
                            </tr>
                            <tr x-show="activeTab === 'inventario'">
                                <th class="px-6 py-4 font-semibold">Código</th>
                                <th class="px-6 py-4 font-semibold">Nombre</th>
                                <th class="px-6 py-4 font-semibold">Categoría</th>
                                <th class="px-6 py-4 font-semibold">Sede</th>
                                <th class="px-6 py-4 font-semibold text-right">Costo</th>
                                <th class="px-6 py-4 font-semibold text-right">Stock</th>
                                <th class="px-6 py-4 font-semibold text-right">Valor Inv.</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-700/50">
                            <!-- Ventas Rows -->
                            <template x-if="activeTab === 'ventas'">
                                <template x-for="row in tableData" :key="row.id">
                                    <tr class="hover:bg-slate-700/20">
                                        <td class="px-6 py-3 text-slate-300" x-text="row.fecha"></td>
                                        <td class="px-6 py-3 font-medium text-white" x-text="row.id"></td>
                                        <td class="px-6 py-3 text-slate-300" x-text="row.mesa"></td>
                                        <td class="px-6 py-3 text-slate-300" x-text="row.mesero"></td>
                                        <td class="px-6 py-3 text-right text-slate-300" x-text="formatCurrency(row.subtotal)"></td>
                                        <td class="px-6 py-3 text-right text-slate-300" x-text="formatCurrency(row.propina)"></td>
                                        <td class="px-6 py-3 text-right font-bold text-amber-500" x-text="formatCurrency(row.total)"></td>
                                        <td class="px-6 py-3 text-slate-300 uppercase text-xs font-semibold" x-text="row.metodo_pago"></td>
                                    </tr>
                                </template>
                            </template>
                            <!-- Inventario Rows -->
                            <template x-if="activeTab === 'inventario'">
                                <template x-for="row in tableData" :key="row.id">
                                    <tr class="hover:bg-slate-700/20">
                                        <td class="px-6 py-3 text-slate-400 font-mono" x-text="row.codigo"></td>
                                        <td class="px-6 py-3 font-medium text-white" x-text="row.nombre"></td>
                                        <td class="px-6 py-3 text-slate-300" x-text="row.categoria"></td>
                                        <td class="px-6 py-3 text-slate-300" x-text="row.sede"></td>
                                        <td class="px-6 py-3 text-right text-slate-300" x-text="formatCurrency(row.costo)"></td>
                                        <td class="px-6 py-3 text-right font-bold text-white" x-text="row.stock"></td>
                                        <td class="px-6 py-3 text-right font-bold text-amber-500" x-text="formatCurrency(row.costo * row.stock)"></td>
                                    </tr>
                                </template>
                            </template>
                            <tr x-show="tableData.length === 0">
                                <td colspan="10" class="px-6 py-8 text-center text-slate-500">No hay datos para mostrar. Presiona "Vista Previa".</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('reportesPage', () => ({
                activeTab: 'ventas',
                sedes: [],
                filters: { desde: '', hasta: '', sede_id: '' },
                tableData: [],
                summaryStats: [],
                
                async init() {
                    const today = new Date().toISOString().split('T')[0];
                    const firstDay = new Date(new Date().setDate(1)).toISOString().split('T')[0];
                    this.filters.desde = firstDay;
                    this.filters.hasta = today;
                    this.sedes = await window.api.get('/api/sedes').catch(()=>[{id:1, nombre:'Sede Norte'}]) || [];
                    this.generarReporte();
                },

                async generarReporte() {
                    this.tableData = [];
                    if (this.activeTab === 'ventas') {
                        // Mock data
                        this.tableData = [
                            {id: 101, fecha: '2023-10-15 19:30', mesa: '5', mesero: 'Juan Pérez', subtotal: 45000, propina: 4500, total: 49500, metodo_pago: 'efectivo'},
                            {id: 102, fecha: '2023-10-15 20:15', mesa: '2', mesero: 'Ana Gómez', subtotal: 150000, propina: 15000, total: 165000, metodo_pago: 'tarjeta'}
                        ];
                        const t = this.tableData.reduce((acc, row)=>acc+row.total, 0);
                        this.summaryStats = [
                            { label: 'Total Ventas', value: this.formatCurrency(t) },
                            { label: 'Órdenes', value: this.tableData.length },
                            { label: 'Promedio/Orden', value: this.formatCurrency(t/this.tableData.length) },
                            { label: 'Propinas', value: this.formatCurrency(this.tableData.reduce((acc, row)=>acc+row.propina, 0)) }
                        ];
                    } else {
                        // Mock data
                        this.tableData = [
                            {id: 1, codigo: 'CER-01', nombre: 'Corona', categoria: 'Cervezas', sede: 'Norte', costo: 3000, stock: 45},
                            {id: 2, codigo: 'LIC-01', nombre: 'Don Julio', categoria: 'Licores', sede: 'Norte', costo: 80000, stock: 5}
                        ];
                        const totalInv = this.tableData.reduce((acc, row)=>acc+(row.costo*row.stock), 0);
                        this.summaryStats = [
                            { label: 'Valor Inventario', value: this.formatCurrency(totalInv) },
                            { label: 'Total Productos', value: this.tableData.length },
                            { label: 'Stock Total', value: this.tableData.reduce((acc, row)=>acc+row.stock, 0) },
                            { label: 'Categorías', value: 2 }
                        ];
                    }
                },

                formatCurrency(val) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val); }
            }));
        });
    </script>
</body>
</html>
