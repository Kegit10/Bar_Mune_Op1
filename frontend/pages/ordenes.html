<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Órdenes - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 900: '#0B0F19', 800: '#141C2E', 700: '#222E46', 600: '#334466', 400: '#94A3B8', 300: '#CBD5E1' },
                        amber: { 500: '#7C3AED', 600: '#6D28D9', 400: '#A855F7', 300: '#C4B5FD' },
                        lune: { bg: '#0B0F19', card: '#141C2E', border: '#222E46', blue: '#2A40FF', purple: '#7C3AED', violet: '#A855F7', lavender: '#C4B5FD' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true }">

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex flex-shrink-0">
        <div class="h-16 flex items-center px-4 border-b border-slate-700 gap-3 overflow-hidden">
            <img src="../assets/Logos/Isotipo.png" alt="Bar Mune" class="h-8 w-8 object-contain flex-shrink-0" />
            <img x-show="sidebarOpen" src="../assets/Logos/Horizontal_Fondo_Transparente_Positivo.png" alt="Bar Mune" class="h-6 w-auto object-contain" />
        </div>

        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2" id="sidebar-nav">
            <a href="dashboard.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Dashboard</span>
            </a>
            <a href="ordenes.html" class="flex items-center px-3 py-2.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Órdenes</span>
            </a>
            <a href="pagos.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Pagos</span>
            </a>
            <a href="inventario.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Inventario</span>
            </a>
            <a href="stock-alertas.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Alertas Stock</span>
            </a>
            <a href="reportes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-cajero nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Reportes</span>
            </a>

            <div class="nav-admin border-t border-slate-700 my-2" style="display:none"></div>

            <a href="usuarios.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Usuarios</span>
            </a>
            <a href="sedes.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Sedes</span>
            </a>
            <a href="parametros.html" class="flex items-center px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700/50 hover:text-white transition-colors nav-admin" style="display:none">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span x-show="sidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap">Parámetros</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0" x-data="ordenesPage()" x-init="init()">
        <!-- Topbar -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10 flex-shrink-0">
            <div class="flex items-center gap-4">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-xl font-semibold text-white">Gestión de Órdenes</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Sede Badge/Selector in Topbar -->
                <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 gap-2">
                    <span class="text-amber-400 text-xs font-bold">📍 Sede:</span>
                    <template x-if="isAdmin">
                        <select x-model="selectedSedeId" @change="onSedeChange()" class="bg-transparent text-white text-xs font-semibold focus:outline-none cursor-pointer">
                            <template x-for="s in sedes" :key="s.id">
                                <option :value="s.id" class="bg-slate-800 text-white" x-text="s.nombre"></option>
                            </template>
                        </select>
                    </template>
                    <template x-if="!isAdmin">
                        <span class="text-white text-xs font-semibold" x-text="currentSedeName"></span>
                    </template>
                </div>

                <div class="text-right hidden sm:block">
                    <p id="user-name" class="text-sm font-medium text-white"></p>
                    <p id="user-rol" class="text-xs text-slate-400 capitalize"></p>
                </div>
                <button onclick="window.auth.logout()" title="Cerrar sesión" class="p-2 text-slate-400 hover:text-red-400 transition-colors rounded-lg hover:bg-red-400/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 flex overflow-hidden">
            <!-- PANEL IZQUIERDO: Mesas -->
            <div class="w-80 border-r border-slate-700 bg-slate-900 overflow-y-auto p-4 flex flex-col flex-shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mesas</h2>
                        <p class="text-[11px] text-amber-400 font-medium" x-text="currentSedeName"></p>
                    </div>
                    <button @click="refreshData()" title="Refrescar" class="text-xs text-slate-400 hover:text-white p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    </button>
                </div>
                
                <div class="grid grid-cols-3 gap-3">
                    <template x-for="m in mesas" :key="m.numero">
                        <button @click="selectMesa(m)" 
                            :class="{
                                'border-amber-500 bg-amber-500/20 text-amber-300 ring-2 ring-amber-500': selectedMesa?.numero === m.numero,
                                'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700': selectedMesa?.numero !== m.numero && !m.orden,
                                'bg-blue-900/40 border-blue-600 text-blue-300': selectedMesa?.numero !== m.numero && m.orden && m.orden.estado === 'en_proceso',
                                'bg-amber-900/40 border-amber-600 text-amber-300': selectedMesa?.numero !== m.numero && m.orden && m.orden.estado === 'abierta',
                                'bg-green-900/40 border-green-600 text-green-300': selectedMesa?.numero !== m.numero && m.orden && m.orden.estado === 'lista'
                            }"
                            class="p-3.5 rounded-xl border flex flex-col items-center justify-center transition-all relative">
                            <span class="text-base font-bold" x-text="'Mesa ' + m.numero"></span>
                            <span class="text-[10px] mt-1 uppercase font-semibold"
                                :class="m.orden ? 'text-amber-400' : 'text-slate-500'"
                                x-text="m.orden ? m.orden.estado.replace('_', ' ') : 'Libre'"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- PANEL DERECHO: Detalle de Orden -->
            <div class="flex-1 bg-slate-900/50 overflow-y-auto p-6 flex flex-col justify-between">
                <template x-if="!selectedMesa">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500">
                        <svg class="w-16 h-16 text-slate-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        <p class="text-base font-medium text-slate-400">Selecciona una mesa para gestionar su orden</p>
                    </div>
                </template>

                <template x-if="selectedMesa">
                    <div class="h-full flex flex-col">
                        <!-- Header Orden -->
                        <div class="flex justify-between items-center pb-5 border-b border-slate-700 mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                                    <span x-text="'Mesa ' + selectedMesa.numero"></span>
                                    <span x-show="currentOrder" class="text-xs px-2.5 py-1 rounded-full uppercase font-bold tracking-wider"
                                        :class="{
                                            'bg-amber-500/20 text-amber-400 border border-amber-500/30': currentOrder?.estado === 'abierta',
                                            'bg-blue-500/20 text-blue-400 border border-blue-500/30': currentOrder?.estado === 'en_proceso',
                                            'bg-green-500/20 text-green-400 border border-green-500/30': currentOrder?.estado === 'lista'
                                        }"
                                        x-text="currentOrder?.estado?.replace('_', ' ')"></span>
                                </h2>
                                <p x-show="currentOrder" class="text-xs text-slate-400 mt-1" x-text="`Orden #${currentOrder?.numero_orden || currentOrder?.id?.slice(0,6)} • Sede: ${currentSedeName} • Mesero: ${currentOrder?.mesero_nombre || 'N/A'}`"></p>
                            </div>

                            <div class="flex gap-3">
                                <button x-show="!currentOrder" @click="createOrder()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                    Abrir Orden
                                </button>
                                <button x-show="currentOrder" @click="openAddProductsModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 shadow-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                    + Agregar Productos
                                </button>
                                <button x-show="currentOrder" @click="cancelOrder()" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-sm font-medium transition-colors">
                                    Cancelar Orden
                                </button>
                            </div>
                        </div>

                        <!-- Items List -->
                        <div class="flex-1 overflow-y-auto mb-6 pr-2">
                            <template x-if="currentOrder && currentOrder.items && currentOrder.items.length > 0">
                                <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-sm">
                                    <table class="w-full text-left text-sm whitespace-nowrap">
                                        <thead class="bg-slate-900/60 text-slate-400">
                                            <tr>
                                                <th class="px-5 py-3">Producto</th>
                                                <th class="px-5 py-3 text-center">Cant.</th>
                                                <th class="px-5 py-3 text-right">Precio Unit.</th>
                                                <th class="px-5 py-3 text-right">Subtotal</th>
                                                <th class="px-5 py-3 text-right"></th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-700/50">
                                            <template x-for="it in currentOrder.items" :key="it.id">
                                                <tr class="hover:bg-slate-700/20">
                                                    <td class="px-5 py-3.5 font-medium text-white" x-text="it.producto_nombre"></td>
                                                    <td class="px-5 py-3.5 text-center font-bold text-amber-400" x-text="it.cantidad"></td>
                                                    <td class="px-5 py-3.5 text-right text-slate-400" x-text="formatCurrency(it.precio_unitario)"></td>
                                                    <td class="px-5 py-3.5 text-right font-semibold text-white" x-text="formatCurrency(it.subtotal)"></td>
                                                    <td class="px-5 py-3.5 text-right">
                                                        <button @click="removeItem(it.id)" class="text-slate-500 hover:text-red-400 p-1 transition-colors">
                                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template x-if="!currentOrder">
                                <div class="bg-slate-800/40 rounded-xl p-8 text-center text-slate-500 border border-dashed border-slate-700">
                                    Esta mesa está libre. Presiona "Abrir Orden" para iniciar el pedido en <span class="text-amber-400 font-semibold" x-text="currentSedeName"></span>.
                                </div>
                            </template>

                            <template x-if="currentOrder && (!currentOrder.items || currentOrder.items.length === 0)">
                                <div class="bg-slate-800/40 rounded-xl p-8 text-center text-slate-500 border border-dashed border-slate-700">
                                    No hay productos agregados en esta orden. Presiona "+ Agregar Productos" para seleccionar del inventario.
                                </div>
                            </template>
                        </div>

                        <!-- Totales y Botones de Estado -->
                        <div x-show="currentOrder" class="bg-slate-800 rounded-xl border border-slate-700 p-5">
                            <div class="flex flex-wrap justify-between items-center gap-4">
                                <!-- Status changers -->
                                <div class="flex gap-2">
                                    <button @click="changeStatus('en_proceso')" :class="currentOrder?.estado === 'en_proceso' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                                        En Proceso
                                    </button>
                                    <button @click="changeStatus('lista')" :class="currentOrder?.estado === 'lista' ? 'bg-green-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                                        Lista para Cobro
                                    </button>
                                </div>

                                <!-- Totals -->
                                <div class="flex items-center gap-6">
                                    <div class="text-right">
                                        <p class="text-xs text-slate-400">Subtotal: <span class="text-slate-200" x-text="formatCurrency(currentOrder?.subtotal || 0)"></span></p>
                                        <p class="text-xs text-slate-400">IVA: <span class="text-slate-200" x-text="formatCurrency(currentOrder?.impuesto || 0)"></span></p>
                                    </div>
                                    <div class="text-right pl-4 border-l border-slate-700">
                                        <p class="text-xs text-slate-400 font-medium">TOTAL A PAGAR</p>
                                        <p class="text-2xl font-bold text-amber-400" x-text="formatCurrency(currentOrder?.total || 0)"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Modal Agregar Productos -->
            <div x-show="showAddModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
                <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm" @click="showAddModal = false"></div>
                    <div class="inline-block bg-slate-800 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-2xl sm:w-full border border-slate-700 z-10 p-6">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="text-lg font-bold text-white">Inventario de <span class="text-amber-400" x-text="currentSedeName"></span></h3>
                                <p class="text-xs text-slate-400">Selecciona los productos que deseas agregar a la orden</p>
                            </div>
                            <input type="text" x-model="prodSearch" placeholder="Buscar producto o código..." class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-white focus:border-amber-500 outline-none w-64">
                        </div>

                        <!-- Lista de productos de la sede -->
                        <div class="max-h-80 overflow-y-auto divide-y divide-slate-700/50 mb-6 pr-1">
                            <template x-for="p in filteredProducts" :key="p.id">
                                <div class="py-3 flex items-center justify-between hover:bg-slate-700/20 px-2 rounded-lg transition-colors">
                                    <div>
                                        <p class="font-semibold text-white text-sm" x-text="p.nombre"></p>
                                        <p class="text-xs text-slate-400 mt-0.5">
                                            <span class="font-mono text-amber-500" x-text="p.codigo"></span> • 
                                            Stock: <span class="font-bold" :class="(p.stock_actual || p.stock || 0) > 0 ? 'text-green-400' : 'text-red-400'" x-text="p.stock_actual || p.stock || 0"></span> • 
                                            <span class="text-white font-bold" x-text="formatCurrency(p.precio_venta || p.precio)"></span>
                                        </p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <button type="button" @click="adjustQty(p.id, -1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-bold flex items-center justify-center transition-colors">-</button>
                                        <span class="w-8 text-center font-bold text-amber-400" x-text="itemSelections[p.id] || 0"></span>
                                        <button type="button" @click="adjustQty(p.id, 1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-bold flex items-center justify-center transition-colors">+</button>
                                    </div>
                                </div>
                            </template>

                            <div x-show="filteredProducts.length === 0" class="py-12 text-center text-slate-500">
                                <p>No hay productos activos en el inventario de esta sede.</p>
                                <a href="inventario.html" class="mt-2 inline-block text-xs text-amber-400 hover:underline">Ir a Inventario a crear productos →</a>
                            </div>
                        </div>

                        <!-- Resumen y footer modal -->
                        <div class="flex justify-between items-center border-t border-slate-700/60 pt-4">
                            <span class="text-xs text-slate-400 font-medium" x-text="`${totalItemsSelected} items seleccionados`"></span>
                            <div class="flex gap-3">
                                <button type="button" @click="showAddModal = false" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600">Cancelar</button>
                                <button type="button" @click="confirmAddItems()" :disabled="totalItemsSelected === 0" class="px-4 py-2 bg-amber-500 disabled:opacity-50 text-white rounded-lg text-sm font-semibold hover:bg-amber-600">Confirmar y Agregar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg px-4 py-3 shadow-lg border text-sm font-medium bg-green-900/90 border-green-500 text-green-200" style="display: none;">
                <p x-text="toast.message"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js?v=3"></script>
    <script src="../assets/js/api.js?v=3"></script>
    <script src="../assets/js/auth.js?v=3"></script>
    <script src="../assets/js/factura.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (!user) { window.location.href = '../index.html'; return; }

            const rolNombre = user.rol_nombre || user.rol || '';
            document.getElementById('user-name').textContent = `${user.nombre} ${user.apellido || ''}`.trim();
            document.getElementById('user-rol').textContent = rolNombre;

            const rol = rolNombre.toLowerCase();
            if (rol === 'admin' || rol === 'cajero') {
                document.querySelectorAll('.nav-cajero, .nav-admin').forEach(el => el.style.display = 'flex');
            }
            if (rol === 'admin') {
                document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('div.nav-admin').forEach(el => el.style.display = 'block');
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('ordenesPage', () => ({
                sedes: [],
                selectedSedeId: '',
                mesas: [],
                selectedMesa: null,
                currentOrder: null,
                allProducts: [],
                prodSearch: '',
                itemSelections: {},
                showAddModal: false,
                toast: { show: false, message: '' },

                async init() {
                    await this.fetchSedes();
                    await this.initMesas();
                    await this.refreshData();
                },

                get isAdmin() {
                    return window.auth.hasRole('admin');
                },

                get currentSedeName() {
                    const s = this.sedes.find(item => String(item.id) === String(this.selectedSedeId));
                    return s ? s.nombre : 'Sede Principal';
                },

                get totalItemsSelected() {
                    return Object.values(this.itemSelections).reduce((sum, qty) => sum + (qty || 0), 0);
                },

                get filteredProducts() {
                    const q = this.prodSearch.toLowerCase();
                    return this.allProducts.filter(p => 
                        (p.nombre || '').toLowerCase().includes(q) || 
                        (p.codigo || '').toLowerCase().includes(q)
                    );
                },

                async fetchSedes() {
                    try {
                        const res = await window.api.get('/api/sedes');
                        this.sedes = res?.data || [];
                        const user = window.auth.getUser();
                        
                        // Si el usuario tiene sede asignada, usarla; si no, la primera sede
                        if (user?.sede_id && this.sedes.some(s => String(s.id) === String(user.sede_id))) {
                            this.selectedSedeId = user.sede_id;
                        } else if (this.sedes.length > 0) {
                            this.selectedSedeId = this.sedes[0].id;
                        }
                    } catch(e) {
                        this.sedes = [];
                    }
                },

                async initMesas() {
                    const listaMesas = [];
                    for (let i = 1; i <= 20; i++) {
                        listaMesas.push({ numero: String(i), orden: null });
                    }
                    this.mesas = listaMesas;
                },

                async onSedeChange() {
                    this.selectedMesa = null;
                    this.currentOrder = null;
                    await this.refreshData();
                    if (this.mesas.length > 0) {
                        this.selectMesa(this.mesas[0]);
                    }
                },

                async refreshData() {
                    await this.fetchProducts();
                    await this.fetchActiveOrders();
                },

                async fetchProducts() {
                    try {
                        let url = '/api/productos?estado=activo&limit=500';
                        if (this.selectedSedeId) {
                            url += `&sede_id=${this.selectedSedeId}`;
                        }
                        const res = await window.api.get(url);
                        this.allProducts = res?.data || [];
                    } catch(e) {
                        this.allProducts = [];
                    }
                },

                async fetchActiveOrders() {
                    try {
                        let url = '/api/ordenes?estado=abierta,en_proceso,lista';
                        if (this.selectedSedeId) {
                            url += `&sede_id=${this.selectedSedeId}`;
                        }
                        const res = await window.api.get(url);
                        const orders = res?.data || [];
                        
                        // Mapear órdenes a las mesas de la sede
                        this.mesas.forEach(m => {
                            m.orden = orders.find(o => String(o.mesa) === String(m.numero)) || null;
                        });

                        // Si hay mesa seleccionada, recargar su orden
                        if (this.selectedMesa) {
                            const currentM = this.mesas.find(m => m.numero === this.selectedMesa.numero);
                            if (currentM && currentM.orden) {
                                await this.loadOrderDetails(currentM.orden.id);
                            } else {
                                this.currentOrder = null;
                            }
                        } else if (this.mesas.length > 0) {
                            this.selectMesa(this.mesas[0]);
                        }
                    } catch (e) {
                        console.error("Error cargando órdenes:", e);
                    }
                },

                async selectMesa(mesa) {
                    this.selectedMesa = mesa;
                    if (mesa.orden) {
                        await this.loadOrderDetails(mesa.orden.id);
                    } else {
                        this.currentOrder = null;
                    }
                },

                async loadOrderDetails(ordenId) {
                    try {
                        const res = await window.api.get(`/api/ordenes/${ordenId}`);
                        this.currentOrder = res?.data || null;
                    } catch (e) {
                        this.currentOrder = null;
                    }
                },

                async createOrder() {
                    if (!this.selectedMesa) return;
                    const user = window.auth.getUser();
                    try {
                        const payload = {
                            mesa: this.selectedMesa.numero,
                            sede_id: this.selectedSedeId || user?.sede_id || null,
                            mesero_id: user?.id || null
                        };
                        const res = await window.api.post('/api/ordenes', payload);
                        this.showToast('Orden abierta exitosamente');
                        await this.fetchActiveOrders();
                    } catch(e) {
                        alert(e.message || 'Error al abrir la orden');
                    }
                },

                openAddProductsModal() {
                    this.itemSelections = {};
                    this.prodSearch = '';
                    this.fetchProducts(); // Refrescar stock de la sede actual
                    this.showAddModal = true;
                },

                adjustQty(prodId, delta) {
                    const current = this.itemSelections[prodId] || 0;
                    const next = Math.max(0, current + delta);
                    this.itemSelections[prodId] = next;
                },

                async confirmAddItems() {
                    if (!this.currentOrder) return;
                    const itemsToAdd = [];
                    for (const [prodId, qty] of Object.entries(this.itemSelections)) {
                        if (qty > 0) {
                            itemsToAdd.push({ producto_id: prodId, cantidad: qty });
                        }
                    }
                    if (itemsToAdd.length === 0) return;

                    try {
                        await window.api.post(`/api/ordenes/${this.currentOrder.id}/items`, { items: itemsToAdd });
                        this.showToast('Productos agregados a la orden');
                        this.showAddModal = false;
                        await this.fetchActiveOrders();
                    } catch(e) {
                        alert(e.message || 'Error al agregar productos');
                    }
                },

                async removeItem(itemId) {
                    if (!this.currentOrder) return;
                    try {
                        await window.api.delete(`/api/ordenes/${this.currentOrder.id}/items/${itemId}`);
                        this.showToast('Producto eliminado');
                        await this.fetchActiveOrders();
                    } catch(e) {
                        alert(e.message || 'Error al remover producto');
                    }
                },

                async changeStatus(newStatus) {
                    if (!this.currentOrder) return;
                    try {
                        await window.api.put(`/api/ordenes/${this.currentOrder.id}`, { estado: newStatus });
                        this.showToast(`Estado actualizado a: ${newStatus.replace('_', ' ')}`);
                        await this.fetchActiveOrders();
                    } catch(e) {
                        alert(e.message || 'Error al cambiar estado');
                    }
                },

                async cancelOrder() {
                    if (!this.currentOrder || !confirm('¿Estás seguro de cancelar esta orden? Se repondrá el stock en el inventario.')) return;
                    try {
                        await window.api.delete(`/api/ordenes/${this.currentOrder.id}`);
                        this.showToast('Orden cancelada');
                        await this.fetchActiveOrders();
                    } catch(e) {
                        alert(e.message || 'Error al cancelar la orden');
                    }
                },

                formatCurrency(val) {
                    const num = parseFloat(val) || 0;
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(num);
                },

                showToast(message) {
                    this.toast = { show: true, message };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
