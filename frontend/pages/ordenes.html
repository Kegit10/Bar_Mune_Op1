<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { slate: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' }, amber: { 500: '#F59E0B', 600: '#D97706' } } } } }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true, userRole: window.auth ? window.auth.getUser()?.rol?.toLowerCase() : '' }">
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex">
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <svg class="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2-2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>
            <span x-show="sidebarOpen" class="ml-2 font-bold text-xl tracking-wide whitespace-nowrap">Bar Mune</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="dashboard.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span x-show="sidebarOpen">Dashboard</span></a>
            <a href="usuarios.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span x-show="sidebarOpen">Usuarios</span></a>
            <a href="sedes.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg><span x-show="sidebarOpen">Sedes</span></a>
            <a href="parametros.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg><span x-show="sidebarOpen">Parámetros</span></a>
            <a href="inventario.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg><span x-show="sidebarOpen">Inventario</span></a>
            <a href="stock-alertas.html" x-show="['admin'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg><span x-show="sidebarOpen">Alertas Stock</span></a>
            <a href="ordenes.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 bg-amber-500/10 text-amber-500 border-r-2 border-amber-500"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg><span x-show="sidebarOpen">Órdenes</span></a>
            <a href="pagos.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg><span x-show="sidebarOpen">Pagos</span></a>
            <a href="reportes.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><span x-show="sidebarOpen">Reportes</span></a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10">
            <div class="flex items-center">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="ml-4 text-xl font-semibold text-white">Gestión de Órdenes</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-info" class="text-sm text-slate-300"></span>
                <button onclick="window.auth.logout()" class="text-slate-400 hover:text-red-400 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 flex overflow-hidden" x-data="ordenesPage()">
            <!-- LEFT PANEL: Mesas Grid -->
            <div class="w-1/3 border-r border-slate-700 bg-slate-900 overflow-y-auto p-4">
                <h2 class="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider">Mesas</h2>
                <div class="grid grid-cols-4 gap-3">
                    <template x-for="mesa in mesas" :key="mesa.id">
                        <button @click="selectMesa(mesa)" 
                            :class="{
                                'bg-slate-700 hover:bg-slate-600': mesa.estado === 'libre',
                                'bg-amber-700 hover:bg-amber-600': mesa.estado === 'abierta',
                                'bg-blue-700 hover:bg-blue-600': mesa.estado === 'en_proceso',
                                'bg-green-700 hover:bg-green-600': mesa.estado === 'lista',
                                'bg-slate-600/50 hover:bg-slate-600 opacity-50': mesa.estado === 'pagada',
                                'ring-2 ring-white ring-offset-2 ring-offset-slate-900 scale-105': selectedMesa && selectedMesa.id === mesa.id
                            }"
                            class="aspect-square rounded-xl flex flex-col items-center justify-center transition-all shadow-sm">
                            <span class="text-xl font-bold text-white" x-text="mesa.numero"></span>
                            <span class="text-[10px] uppercase font-semibold text-white/80 mt-1" x-text="mesa.estado.replace('_', ' ')"></span>
                        </button>
                    </template>
                </div>
                
                <div class="mt-8 pt-4 border-t border-slate-800 space-y-2">
                    <div class="flex items-center text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-slate-700 mr-2"></div> Libre</div>
                    <div class="flex items-center text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-amber-700 mr-2"></div> Abierta</div>
                    <div class="flex items-center text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-blue-700 mr-2"></div> En Proceso</div>
                    <div class="flex items-center text-xs text-slate-400"><div class="w-3 h-3 rounded-full bg-green-700 mr-2"></div> Lista para Pago</div>
                </div>
            </div>

            <!-- RIGHT PANEL: Order Details -->
            <div class="w-2/3 bg-slate-800 flex flex-col">
                <template x-if="!selectedMesa">
                    <div class="flex-1 flex flex-col items-center justify-center text-slate-500">
                        <svg class="w-20 h-20 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        <p class="text-lg">Selecciona una mesa para ver o crear una orden</p>
                    </div>
                </template>

                <template x-if="selectedMesa">
                    <div class="flex-1 flex flex-col h-full">
                        <!-- Header -->
                        <div class="p-6 border-b border-slate-700 flex justify-between items-start bg-slate-900/50">
                            <div>
                                <h2 class="text-2xl font-bold text-white mb-1">Mesa <span x-text="selectedMesa.numero"></span></h2>
                                <template x-if="currentOrder">
                                    <p class="text-sm text-slate-400">Orden #<span x-text="currentOrder.id"></span> • Mesero: <span x-text="currentOrder.mesero_nombre || 'No asignado'"></span></p>
                                </template>
                            </div>
                            <template x-if="currentOrder">
                                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider" 
                                    :class="{
                                        'bg-amber-500/20 text-amber-500': currentOrder.estado === 'abierta',
                                        'bg-blue-500/20 text-blue-500': currentOrder.estado === 'en_proceso',
                                        'bg-green-500/20 text-green-500': currentOrder.estado === 'lista',
                                        'bg-slate-500/20 text-slate-500': currentOrder.estado === 'pagada'
                                    }" x-text="currentOrder.estado.replace('_', ' ')"></span>
                            </template>
                        </div>

                        <!-- No Order State -->
                        <template x-if="!currentOrder && selectedMesa.estado === 'libre'">
                            <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                                <div class="w-full max-w-sm">
                                    <label class="block text-left text-sm font-medium text-slate-300 mb-2">Notas iniciales (Opcional)</label>
                                    <textarea x-model="newOrderNotes" class="w-full border border-slate-600 rounded-md bg-slate-700 text-white px-3 py-2 mb-6 focus:ring-amber-500 focus:border-amber-500" rows="3" placeholder="Ej: Cumpleaños, terraza..."></textarea>
                                    <button @click="createOrder()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition-transform hover:scale-105">
                                        Abrir Mesa y Crear Orden
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Active Order State -->
                        <template x-if="currentOrder">
                            <div class="flex-1 flex flex-col overflow-hidden">
                                <div class="flex-1 overflow-y-auto p-6">
                                    <table class="w-full text-left text-sm whitespace-nowrap">
                                        <thead class="text-slate-400 border-b border-slate-700">
                                            <tr>
                                                <th class="pb-3 font-semibold">Producto</th>
                                                <th class="pb-3 font-semibold text-center">Cant.</th>
                                                <th class="pb-3 font-semibold text-right">Precio Unit.</th>
                                                <th class="pb-3 font-semibold text-right">Subtotal</th>
                                                <th class="pb-3 font-semibold text-right"></th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-700/50">
                                            <template x-for="item in currentOrder.items" :key="item.id">
                                                <tr class="group">
                                                    <td class="py-4 font-medium text-white" x-text="item.producto_nombre"></td>
                                                    <td class="py-4 text-center text-slate-300" x-text="item.cantidad"></td>
                                                    <td class="py-4 text-right text-slate-300" x-text="formatCurrency(item.precio_unitario)"></td>
                                                    <td class="py-4 text-right font-semibold text-white" x-text="formatCurrency(item.subtotal)"></td>
                                                    <td class="py-4 text-right">
                                                        <button @click="removeItem(item)" x-show="['abierta', 'en_proceso'].includes(currentOrder.estado)" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                            <tr x-show="!currentOrder.items || currentOrder.items.length === 0">
                                                <td colspan="5" class="py-8 text-center text-slate-500">No hay productos en esta orden.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    
                                    <button @click="openAddProductsModal()" x-show="['abierta', 'en_proceso'].includes(currentOrder.estado)" class="mt-4 w-full py-3 border-2 border-dashed border-slate-600 rounded-xl text-slate-400 hover:text-amber-500 hover:border-amber-500 hover:bg-amber-500/10 transition-colors flex items-center justify-center font-medium">
                                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Agregar Productos
                                    </button>
                                </div>
                                
                                <div class="bg-slate-900/50 p-6 border-t border-slate-700">
                                    <div class="flex justify-between items-end mb-6">
                                        <div class="text-sm text-slate-400">Total</div>
                                        <div class="text-3xl font-bold text-amber-500" x-text="formatCurrency(orderTotal)"></div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <button @click="changeOrderStatus('en_proceso')" x-show="currentOrder.estado === 'abierta'" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Enviar a Preparación</button>
                                        <button @click="changeOrderStatus('lista')" x-show="currentOrder.estado === 'en_proceso'" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">Marcar Lista p/ Pago</button>
                                        <button @click="changeOrderStatus('abierta')" x-show="['en_proceso', 'lista'].includes(currentOrder.estado)" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors">Revertir Estado</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Modal Add Products -->
            <div x-show="showAddModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" style="display: none;">
                <div class="fixed inset-0 bg-slate-900/90 transition-opacity" @click="showAddModal = false"></div>
                <div class="bg-slate-800 rounded-xl shadow-2xl w-full max-w-4xl max-h-full flex flex-col border border-slate-700 relative z-10 overflow-hidden">
                    <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                        <h3 class="text-lg font-bold text-white">Agregar a Orden</h3>
                        <input type="text" x-model="productSearch" placeholder="Buscar..." class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-sm text-white focus:ring-amber-500 ml-4 w-64">
                        <button @click="showAddModal = false" class="text-slate-400 hover:text-white ml-4"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-4 bg-slate-900">
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                            <template x-for="prod in filteredProductsForAdd" :key="prod.id">
                                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col hover:border-amber-500/50 transition-colors">
                                    <div class="flex-1">
                                        <h4 class="font-bold text-white leading-tight mb-1" x-text="prod.nombre"></h4>
                                        <p class="text-amber-500 font-semibold mb-2" x-text="formatCurrency(prod.precio_venta)"></p>
                                        <p class="text-xs text-slate-400 mb-4">Stock: <span x-text="prod.stock_actual"></span></p>
                                    </div>
                                    <div class="flex items-center justify-between bg-slate-900 rounded-lg p-1">
                                        <button @click="adjustQty(prod.id, -1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 rounded-md">-</button>
                                        <span class="font-medium w-8 text-center" x-text="productSelections[prod.id] || 0"></span>
                                        <button @click="adjustQty(prod.id, 1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 rounded-md">+</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="p-4 border-t border-slate-700 bg-slate-900/50 flex justify-between items-center">
                        <div class="text-slate-300"><span class="font-bold text-white" x-text="totalSelectedItems"></span> items seleccionados</div>
                        <button @click="confirmAddProducts()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-6 py-2 rounded-lg transition-colors" :disabled="totalSelectedItems === 0">Confirmar</button>
                    </div>
                </div>
            </div>

            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg p-4 shadow-lg border bg-green-500/10 border-green-500/50 text-green-400" style="display: none;">
                <p x-text="toast.message" class="text-sm font-medium"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (user) document.getElementById('user-info').textContent = `${user.nombre} (${user.rol})`;
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('ordenesPage', () => ({
                mesas: Array.from({length: 20}, (_, i) => ({ id: i+1, numero: i+1, estado: 'libre' })),
                selectedMesa: null,
                currentOrder: null,
                newOrderNotes: '',
                
                showAddModal: false,
                allProducts: [],
                productSearch: '',
                productSelections: {},
                
                toast: { show: false, message: '' },

                async init() {
                    // Mock fetch mesas with states
                    this.mesas[2].estado = 'abierta';
                    this.mesas[5].estado = 'en_proceso';
                    this.mesas[8].estado = 'lista';
                    
                    await this.fetchAllProducts();
                },

                async fetchAllProducts() {
                    this.allProducts = await window.api.get('/api/productos').catch(() => [
                        {id: 1, nombre: 'Cerveza Corona', precio_venta: 8000, stock_actual: 45},
                        {id: 2, nombre: 'Tequila Don Julio', precio_venta: 150000, stock_actual: 5},
                        {id: 3, nombre: 'Nachos con Queso', precio_venta: 25000, stock_actual: 100},
                        {id: 4, nombre: 'Margarita', precio_venta: 30000, stock_actual: 100}
                    ]) || [];
                },

                get filteredProductsForAdd() {
                    if(!this.productSearch) return this.allProducts;
                    return this.allProducts.filter(p => p.nombre.toLowerCase().includes(this.productSearch.toLowerCase()));
                },

                get totalSelectedItems() {
                    return Object.values(this.productSelections).reduce((a, b) => a + b, 0);
                },

                get orderTotal() {
                    if(!this.currentOrder || !this.currentOrder.items) return 0;
                    return this.currentOrder.items.reduce((acc, item) => acc + item.subtotal, 0);
                },

                async selectMesa(mesa) {
                    this.selectedMesa = mesa;
                    if (mesa.estado !== 'libre') {
                        // Fetch order for this mesa
                        try {
                            const ordenes = await window.api.get(`/api/ordenes?mesa_id=${mesa.id}`).catch(()=>[]);
                            if(ordenes && ordenes.length > 0) {
                                this.currentOrder = ordenes[0];
                            } else {
                                // Mock
                                this.currentOrder = {
                                    id: 100 + mesa.id, mesa_id: mesa.id, estado: mesa.estado, mesero_nombre: 'Juan Pérez',
                                    items: [ { id: 1, producto_id: 1, producto_nombre: 'Cerveza Corona', cantidad: 2, precio_unitario: 8000, subtotal: 16000 } ]
                                };
                            }
                        } catch(e) {}
                    } else {
                        this.currentOrder = null;
                        this.newOrderNotes = '';
                    }
                },

                async createOrder() {
                    if(!this.selectedMesa) return;
                    try {
                        const payload = { mesa_id: this.selectedMesa.id, notas: this.newOrderNotes, sede_id: 1 };
                        // const res = await window.api.post('/api/ordenes', payload);
                        
                        // Mock update
                        this.selectedMesa.estado = 'abierta';
                        this.currentOrder = { id: Date.now(), mesa_id: this.selectedMesa.id, estado: 'abierta', items: [] };
                        this.showToast('Orden creada');
                    } catch(e) {}
                },

                openAddProductsModal() {
                    this.productSelections = {};
                    this.productSearch = '';
                    this.showAddModal = true;
                },

                adjustQty(productId, change) {
                    const current = this.productSelections[productId] || 0;
                    const next = current + change;
                    if (next >= 0) this.productSelections[productId] = next;
                },

                async confirmAddProducts() {
                    const itemsToAdd = [];
                    for (const [prodId, qty] of Object.entries(this.productSelections)) {
                        if (qty > 0) {
                            itemsToAdd.push({ producto_id: parseInt(prodId), cantidad: qty });
                        }
                    }
                    if(itemsToAdd.length === 0) return;

                    try {
                        // await window.api.post(`/api/ordenes/${this.currentOrder.id}/items`, { items: itemsToAdd });
                        // Mock Update UI
                        for(const item of itemsToAdd) {
                            const p = this.allProducts.find(p=>p.id === item.producto_id);
                            this.currentOrder.items.push({
                                id: Date.now()+Math.random(), producto_id: p.id, producto_nombre: p.nombre,
                                cantidad: item.cantidad, precio_unitario: p.precio_venta, subtotal: p.precio_venta * item.cantidad
                            });
                        }
                        this.showAddModal = false;
                        this.showToast('Productos agregados');
                    } catch(e) {}
                },

                async removeItem(item) {
                    try {
                        // await window.api.delete(`/api/ordenes/${this.currentOrder.id}/items/${item.id}`);
                        this.currentOrder.items = this.currentOrder.items.filter(i => i.id !== item.id);
                        this.showToast('Producto eliminado');
                    } catch(e){}
                },

                async changeOrderStatus(newStatus) {
                    try {
                        // await window.api.put(`/api/ordenes/${this.currentOrder.id}/estado`, { estado: newStatus });
                        this.currentOrder.estado = newStatus;
                        this.selectedMesa.estado = newStatus;
                        this.showToast('Estado actualizado');
                    } catch(e){}
                },

                formatCurrency(val) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val); },
                showToast(message) { this.toast = { show: true, message }; setTimeout(() => { this.toast.show = false; }, 3000); }
            }));
        });
    </script>
</body>
</html>
