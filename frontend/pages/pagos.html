<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - Bar Mune</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { slate: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' }, amber: { 500: '#F59E0B', 600: '#D97706' } } } } }
    </script>
    <link rel="stylesheet" href="../assets/css/app.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen overflow-hidden" x-data="{ sidebarOpen: true, userRole: window.auth ? window.auth.getUser()?.rol?.toLowerCase() : '' }">
    <!-- Sidebar template -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-[#0D1526] border-r border-slate-700 transition-all duration-300 flex flex-col h-full z-20 hidden md:flex">
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <svg class="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>
            <span x-show="sidebarOpen" class="ml-2 font-bold text-xl tracking-wide whitespace-nowrap">Bar Mune</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="dashboard.html" x-show="['admin','cajero','mesero'].includes(userRole)" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span x-show="sidebarOpen">Dashboard</span></a>
            <a href="pagos.html" x-show="['admin','cajero'].includes(userRole)" class="flex items-center px-4 py-3 bg-amber-500/10 text-amber-500 border-r-2 border-amber-500"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg><span x-show="sidebarOpen">Pagos</span></a>
            <a href="dashboard.html" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white"><svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg><span x-show="sidebarOpen">Volver</span></a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-10">
            <h1 class="text-xl font-semibold text-white ml-4">Módulo de Pagos</h1>
        </header>

        <main class="flex-1 flex overflow-hidden" x-data="pagosPage()">
            <!-- Left: Orders -->
            <div class="w-2/5 border-r border-slate-700 bg-slate-900 overflow-y-auto p-4 flex flex-col">
                <h2 class="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider">Órdenes Pendientes</h2>
                <div class="space-y-3 flex-1">
                    <template x-for="orden in ordenes" :key="orden.id">
                        <div @click="selectOrder(orden)" 
                            :class="selectedOrder && selectedOrder.id === orden.id ? 'bg-amber-500/10 border-amber-500' : 'bg-slate-800 border-slate-700 hover:border-slate-500'"
                            class="border rounded-xl p-4 cursor-pointer transition-colors shadow-sm relative overflow-hidden group">
                            
                            <div class="absolute top-0 left-0 w-1 h-full" :class="orden.estado === 'lista' ? 'bg-green-500' : 'bg-blue-500'"></div>
                            
                            <div class="flex justify-between items-start pl-2">
                                <div>
                                    <h3 class="text-lg font-bold text-white mb-1">Mesa <span x-text="orden.mesa_numero"></span></h3>
                                    <p class="text-sm text-slate-400">Orden #<span x-text="orden.id"></span></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-lg font-bold text-amber-500" x-text="formatCurrency(orden.total)"></p>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider mt-1 inline-block" 
                                        :class="orden.estado === 'lista' ? 'bg-green-500/20 text-green-500' : 'bg-blue-500/20 text-blue-500'" 
                                        x-text="orden.estado"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                    <div x-show="ordenes.length === 0" class="text-center text-slate-500 py-12">No hay órdenes pendientes de pago.</div>
                </div>
            </div>

            <!-- Right: Terminal -->
            <div class="w-3/5 bg-slate-800 flex flex-col">
                <template x-if="!selectedOrder">
                    <div class="flex-1 flex items-center justify-center text-slate-500">Seleccione una orden para procesar el pago</div>
                </template>
                <template x-if="selectedOrder">
                    <div class="flex flex-col h-full">
                        <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                            <h2 class="text-2xl font-bold">Cobrar Mesa <span x-text="selectedOrder.mesa_numero"></span></h2>
                        </div>
                        
                        <!-- Order Items List -->
                        <div class="flex-1 overflow-y-auto p-6 bg-slate-900/30">
                            <table class="w-full text-sm">
                                <tbody class="divide-y divide-slate-700/50">
                                    <template x-for="item in selectedOrder.items" :key="item.id">
                                        <tr>
                                            <td class="py-2 text-slate-300"><span x-text="item.cantidad"></span>x <span class="font-medium text-white ml-2" x-text="item.producto_nombre"></span></td>
                                            <td class="py-2 text-right font-medium" x-text="formatCurrency(item.subtotal)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <!-- Totals & Payment form -->
                        <div class="p-6 border-t border-slate-700 bg-slate-800">
                            <div class="flex justify-between items-center mb-2 text-slate-400"><span>Subtotal</span><span x-text="formatCurrency(subtotal)"></span></div>
                            <div class="flex justify-between items-center mb-4 text-slate-400"><span>Propina (Opcional)</span>
                                <div class="flex items-center">
                                    <span class="mr-2 text-white">$</span>
                                    <input type="number" x-model.number="propina" class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-right w-24 text-white">
                                </div>
                            </div>
                            <div class="flex justify-between items-center mb-6 text-xl font-bold">
                                <span class="text-white">TOTAL A COBRAR</span>
                                <span class="text-amber-500 text-3xl" x-text="formatCurrency(totalAcobrar)"></span>
                            </div>

                            <div class="mb-6">
                                <p class="text-sm font-medium text-slate-300 mb-3">Método de Pago</p>
                                <div class="grid grid-cols-3 gap-4">
                                    <button @click="metodoPago = 'efectivo'" :class="metodoPago === 'efectivo' ? 'bg-amber-500/20 border-amber-500 text-amber-500 ring-1 ring-amber-500' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'" class="border rounded-xl py-3 flex flex-col items-center justify-center transition-all">
                                        <span class="text-2xl mb-1">💵</span> <span class="font-medium text-sm">Efectivo</span>
                                    </button>
                                    <button @click="metodoPago = 'tarjeta'" :class="metodoPago === 'tarjeta' ? 'bg-amber-500/20 border-amber-500 text-amber-500 ring-1 ring-amber-500' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'" class="border rounded-xl py-3 flex flex-col items-center justify-center transition-all">
                                        <span class="text-2xl mb-1">💳</span> <span class="font-medium text-sm">Tarjeta</span>
                                    </button>
                                    <button @click="metodoPago = 'transferencia'" :class="metodoPago === 'transferencia' ? 'bg-amber-500/20 border-amber-500 text-amber-500 ring-1 ring-amber-500' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'" class="border rounded-xl py-3 flex flex-col items-center justify-center transition-all">
                                        <span class="text-2xl mb-1">🔄</span> <span class="font-medium text-sm">Transf.</span>
                                    </button>
                                </div>
                            </div>

                            <div x-show="metodoPago === 'efectivo'" x-collapse class="mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                                <label class="block text-sm font-medium text-slate-300 mb-2">Monto Recibido</label>
                                <input type="number" x-model.number="montoRecibido" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-lg font-bold text-white text-right focus:ring-amber-500">
                                <div class="flex justify-between items-center mt-3 text-lg" :class="cambio >= 0 ? 'text-green-400 font-bold' : 'text-red-400'">
                                    <span>Cambio:</span>
                                    <span x-text="formatCurrency(Math.max(0, cambio))"></span>
                                </div>
                            </div>

                            <button @click="confirmarPago()" :disabled="!canSubmit" 
                                :class="!canSubmit ? 'opacity-50 cursor-not-allowed bg-slate-600 text-slate-400' : 'bg-amber-500 hover:bg-amber-600 text-white shadow-lg'" 
                                class="w-full py-4 rounded-xl font-bold text-lg transition-all flex justify-center items-center">
                                Confirmar Pago
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Receipt Modal -->
            <div x-show="showReceipt" class="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div class="fixed inset-0 bg-slate-900/90" @click="showReceipt = false"></div>
                <div class="bg-white text-black w-full max-w-sm p-6 rounded-none relative z-10 font-mono shadow-2xl" id="print-area">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold">BAR MUNE</h2>
                        <p class="text-xs mt-1">NIT: 900.123.456-7</p>
                        <p class="text-xs">COMPROBANTE DE PAGO</p>
                    </div>
                    <div class="text-sm mb-4 border-b border-black pb-2 border-dashed">
                        <p>Orden: #<span x-text="lastReceipt?.orden_id"></span></p>
                        <p>Mesa: <span x-text="lastReceipt?.mesa"></span></p>
                        <p>Fecha: <span x-text="lastReceipt?.fecha"></span></p>
                    </div>
                    <table class="w-full text-sm mb-4 border-b border-black pb-2 border-dashed">
                        <tbody>
                            <template x-for="item in lastReceipt?.items" :key="item.id">
                                <tr>
                                    <td class="py-1"><span x-text="item.cantidad"></span>x <span x-text="item.producto_nombre"></span></td>
                                    <td class="py-1 text-right" x-text="formatCurrency(item.subtotal)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <div class="text-sm border-b border-black pb-2 border-dashed">
                        <div class="flex justify-between"><span>Subtotal</span><span x-text="formatCurrency(lastReceipt?.subtotal)"></span></div>
                        <div class="flex justify-between"><span>Propina</span><span x-text="formatCurrency(lastReceipt?.propina)"></span></div>
                        <div class="flex justify-between font-bold text-base mt-2"><span>TOTAL</span><span x-text="formatCurrency(lastReceipt?.total)"></span></div>
                    </div>
                    <div class="text-sm pt-2 text-center mt-2">
                        <p>Método: <span class="uppercase" x-text="lastReceipt?.metodo_pago"></span></p>
                        <p class="mt-4 font-bold">¡GRACIAS POR SU VISITA!</p>
                    </div>
                    
                    <div class="absolute -top-12 right-0 flex space-x-2 print:hidden">
                        <button @click="window.print()" class="bg-white text-black px-4 py-2 rounded shadow font-sans font-bold flex items-center">🖨️ Imprimir</button>
                        <button @click="closeReceipt()" class="bg-slate-700 text-white px-4 py-2 rounded shadow font-sans font-bold">Cerrar</button>
                    </div>
                </div>
            </div>
            
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg p-4 shadow-lg border bg-green-500/10 border-green-500/50 text-green-400" style="display: none;">
                <p x-text="toast.message" class="text-sm font-medium"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('pagosPage', () => ({
                ordenes: [],
                selectedOrder: null,
                propina: 0,
                metodoPago: 'efectivo',
                montoRecibido: 0,
                showReceipt: false,
                lastReceipt: null,
                toast: { show: false, message: '' },

                async init() { await this.fetchOrders(); },

                async fetchOrders() {
                    const all = await window.api.get('/api/ordenes').catch(()=>[
                        { id: 101, mesa_numero: 5, estado: 'lista', total: 45000, items: [{id:1, cantidad:2, producto_nombre:'Cerveza Corona', subtotal:16000}, {id:2, cantidad:1, producto_nombre:'Nachos', subtotal:29000}] },
                        { id: 102, mesa_numero: 2, estado: 'en_proceso', total: 150000, items: [{id:3, cantidad:1, producto_nombre:'Tequila', subtotal:150000}] }
                    ]);
                    this.ordenes = all.filter(o => ['lista', 'en_proceso', 'abierta'].includes(o.estado));
                },

                selectOrder(orden) {
                    this.selectedOrder = orden;
                    this.propina = 0;
                    this.metodoPago = 'efectivo';
                    this.montoRecibido = 0;
                },

                get subtotal() { return this.selectedOrder ? this.selectedOrder.total : 0; },
                get totalAcobrar() { return this.subtotal + (Number(this.propina) || 0); },
                get cambio() { return this.montoRecibido - this.totalAcobrar; },
                get canSubmit() { 
                    if (!this.selectedOrder) return false;
                    if (this.metodoPago === 'efectivo' && this.montoRecibido < this.totalAcobrar) return false;
                    return true;
                },

                async confirmarPago() {
                    if (!this.canSubmit) return;
                    try {
                        const payload = {
                            orden_id: this.selectedOrder.id,
                            metodo_pago: this.metodoPago,
                            monto_recibido: this.montoRecibido,
                            propina: this.propina,
                            total: this.totalAcobrar
                        };
                        // await window.api.post('/api/pagos', payload);
                        
                        this.lastReceipt = {
                            orden_id: this.selectedOrder.id,
                            mesa: this.selectedOrder.mesa_numero,
                            fecha: new Date().toLocaleString(),
                            items: this.selectedOrder.items,
                            subtotal: this.subtotal,
                            propina: this.propina,
                            total: this.totalAcobrar,
                            metodo_pago: this.metodoPago
                        };
                        
                        this.showReceipt = true;
                        this.toast.show = true; this.toast.message = 'Pago registrado exitosamente';
                        setTimeout(() => this.toast.show = false, 3000);
                        
                        // Remove from list
                        this.ordenes = this.ordenes.filter(o => o.id !== this.selectedOrder.id);
                        this.selectedOrder = null;
                        
                    } catch(e) {}
                },

                closeReceipt() {
                    this.showReceipt = false;
                },

                formatCurrency(val) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(val); }
            }));
        });
    </script>
</body>
</html>
