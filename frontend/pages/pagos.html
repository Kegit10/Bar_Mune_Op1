    <!-- Main Content -->

            <div class="flex items-center gap-2 sm:gap-4 min-w-0">
                <button @click="mobileMenuOpen = true" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 md:hidden flex-shrink-0" title="Open Menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white hidden md:block flex-shrink-0" title="Collapse/Expand">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>

                <h1 class="text-base sm:text-xl font-semibold text-white truncate">Checkout & Payments</h1>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <div class="flex items-center bg-[#0B0F19] border border-[#222E46] rounded-lg px-2.5 sm:px-3 py-1.5 gap-1.5 sm:gap-2 max-w-[150px] sm:max-w-none">
                    <span class="text-amber-400 text-xs font-bold whitespace-nowrap">📍 Branch:</span>
                    
                    <template x-if="isAdmin">
                        <select x-model="selectedSedeId" @change="onSedeChange()" class="bg-transparent text-white text-xs font-semibold focus:outline-none cursor-pointer truncate">
                            <template x-for="s in sedes" :key="s.id">
                                <option :value="s.id" class="bg-[#141C2E] text-white" x-text="s.nombre"></option>
                            </template>
                        </select>
                    </template>
                    
                    <template x-if="!isAdmin">
                        <span class="text-white text-xs font-semibold truncate" x-text="currentSedeName"></span>
                    </template>
                </div>

                <!-- Theme Toggle -->
                <button type="button" onclick="window.toggleTheme()" class="theme-toggle-btn" title="Switch Theme">
                    <span>Theme</span>
                </button>

                <button onclick="window.openPerfilModal()" class="text-right hidden sm:block p-1.5 rounded-xl hover:bg-slate-800/80 transition-all cursor-pointer group" title="View my profile">
                    <p class="user-display-name text-sm font-semibold text-white"></p>
                    <p class="user-display-rol text-xs text-slate-400 capitalize"></p>
                </button>
                <button onclick="window.auth.logout()" title="Sign out" class="p-2 text-slate-400 hover:text-red-400 transition-colors rounded-lg hover:bg-red-400/10 flex-shrink-0">

                <div class="flex justify-between items-center mb-3">
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Orders to Charge</h2>
                        <p class="text-[11px] text-amber-400 font-semibold" x-text="currentSedeName"></p>
                    </div>
                    <button @click="fetchOrders()" title="Refresh" class="text-xs font-semibold text-amber-500 hover:text-amber-400 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span>Refresh</span>
                    </button>
                </div>

                <div class="space-y-3 flex-1">
                    <template x-for="orden in ordenes" :key="orden.id">
                        <div @click="selectOrder(orden)" 
                            :class="selectedOrder?.id === orden.id ? 'bg-amber-500/10 border-amber-500 ring-2 ring-amber-500' : 'bg-slate-800 border-slate-700 hover:border-slate-500'"
                            class="border rounded-xl p-4 cursor-pointer transition-all shadow-sm relative overflow-hidden">
                            
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-base font-bold text-white flex items-center gap-2">
                                        <span x-text="'Table ' + orden.mesa"></span>
                                        <span class="text-xs text-slate-400 font-normal" x-text="`#${orden.numero_orden || orden.id.slice(0,6)}`"></span>
                                    </h3>
                                    <p class="text-xs text-slate-400 mt-1" x-text="`Customer: ${orden.cliente_nombre === 'Consumidor Final' ? 'Walk-in Customer' : (orden.cliente_nombre || 'Walk-in Customer')}`"></p>
                                    <p class="text-[11px] text-slate-500" x-text="`Waiter: ${orden.mesero_nombre || 'N/A'}`"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-base font-bold text-amber-400" x-text="formatCurrency(orden.total)"></p>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider mt-1 inline-block border"
                                        :class="orden.estado === 'lista' ? 'bg-green-500/20 text-green-300 border-green-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30'"
                                        x-text="formatStatus(orden.estado)"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="ordenes.length === 0" class="text-center text-slate-500 py-16 px-4">
                        <svg class="w-12 h-12 mx-auto text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <p class="text-sm font-medium">No pending orders to charge at <span class="text-amber-400 font-bold" x-text="currentSedeName"></span>.</p>
                        <a href="ordenes.html" class="mt-3 inline-block text-xs font-semibold text-amber-400 hover:underline">Go to Orders to dispatch tables →</a>
                    </div>
                </div>
            </div>

            <!-- Right: Payment Terminal -->
            <div class="flex-1 bg-slate-900/50 overflow-y-auto p-6 flex flex-col justify-between">
                <template x-if="!selectedOrder">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500">
                        <svg class="w-16 h-16 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                        <p class="text-base font-semibold text-slate-400">Select an order from the list to process payment</p>
                    </div>
                </template>

                <template x-if="selectedOrder">
                    <div class="max-w-2xl mx-auto w-full flex flex-col space-y-5">
                        <!-- Order Summary Card -->
                        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 shadow-sm">
                            <div class="flex justify-between items-start border-b border-slate-700/60 pb-4 mb-4">
                                <div>
                                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                        <span x-text="`Checkout Table ${selectedOrder.mesa}`"></span>
                                        <span class="text-xs px-2.5 py-0.5 rounded-full uppercase font-bold tracking-wider border"
                                            :class="selectedOrder.estado === 'lista' ? 'bg-green-500/20 text-green-300 border-green-500/30' : 'bg-blue-500/20 text-blue-300 border-blue-500/30'"
                                            x-text="formatStatus(selectedOrder.estado)"></span>
                                    </h2>
                                    <p class="text-xs text-slate-400 mt-1" x-text="`Order #${selectedOrder.numero_orden || selectedOrder.id.slice(0,6)} • Branch: ${selectedOrder.sede_nombre || currentSedeName} • Waiter: ${selectedOrder.mesero_nombre || 'N/A'}`"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-slate-400">Subtotal: <span x-text="formatCurrency(selectedOrder.subtotal)"></span></p>
                                    <p class="text-xs text-slate-400">VAT (19%): <span x-text="formatCurrency(selectedOrder.impuesto)"></span></p>
                                    <p class="text-2xl font-bold text-amber-400 mt-1" x-text="formatCurrency(selectedOrder.total)"></p>
                                </div>
                            </div>

                            <!-- Order items list -->
                            <div x-show="selectedOrder.items && selectedOrder.items.length > 0" class="mb-4 border-b border-slate-700/40 pb-3">
                                <p class="text-xs font-bold text-slate-400 uppercase mb-2">Order Items</p>
                                <div class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                                    <template x-for="item in selectedOrder.items" :key="item.id">
                                        <div class="flex justify-between text-xs py-1.5 px-2.5 rounded bg-slate-900/40 items-center">
                                            <span class="text-white font-semibold" x-text="`${item.cantidad}x ${item.producto_nombre}`"></span>
                                            <span class="text-slate-300 font-mono font-semibold" x-text="formatCurrency(item.subtotal)"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- Payment Form -->
                            <div class="space-y-4">
                                <!-- Customer Data for Electronic Invoice -->
                                <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/70 space-y-2.5">
                                    <p class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        <span>Customer Details (Electronic Invoice)</span>
                                    </p>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Full Name / Company Name *</label>
                                            <input type="text" x-model="clienteNombre" placeholder="Walk-in Customer" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-1.5 text-xs focus:border-amber-500 outline-none font-medium">
                                        </div>
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">ID / Tax ID (NIT) *</label>
                                            <input type="text" x-model="clienteDocumento" placeholder="222222222222" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-1.5 text-xs focus:border-amber-500 outline-none font-medium font-mono">
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Phone (optional)</label>
                                            <input type="text" x-model="clienteTelefono" placeholder="(+57) 300..." class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-1.5 text-xs focus:border-amber-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Email Address (optional)</label>
                                            <input type="email" x-model="clienteEmail" placeholder="customer@email.com" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-1.5 text-xs focus:border-amber-500 outline-none">
                                        </div>
                                    </div>
                                </div>

                                <!-- Payment Methods -->
                                <div>
                                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Payment Method</label>
                                    <div class="grid grid-cols-3 gap-3">
                                        <button type="button" @click="metodoPago = 'efectivo'"
                                            :class="metodoPago === 'efectivo' ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold' : 'bg-slate-700 border-slate-600 text-slate-300'"
                                            class="py-2.5 px-3 rounded-lg border text-sm flex items-center justify-center gap-2 transition-all">
                                            💵 Cash
                                        </button>
                                        <button type="button" @click="metodoPago = 'tarjeta'"
                                            :class="metodoPago === 'tarjeta' ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold' : 'bg-slate-700 border-slate-600 text-slate-300'"
                                            class="py-2.5 px-3 rounded-lg border text-sm flex items-center justify-center gap-2 transition-all">
                                            💳 Card
                                        </button>
                                        <button type="button" @click="metodoPago = 'transferencia'"
                                            :class="metodoPago === 'transferencia' ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold' : 'bg-slate-700 border-slate-600 text-slate-300'"
                                            class="py-2.5 px-3 rounded-lg border text-sm flex items-center justify-center gap-2 transition-all">
                                            📱 Transfer
                                        </button>
                                    </div>
                                </div>

                                <!-- Voluntary tip & amount received -->
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-300 mb-1">Voluntary Tip ($)</label>
                                        <input type="number" x-model.number="propina" min="0" step="500" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-300 mb-1">Amount Received ($)</label>
                                        <input type="number" x-model.number="montoRecibido" min="0" step="500" class="w-full border border-slate-600 rounded-lg bg-slate-700 text-white px-3 py-2 text-sm focus:border-amber-500 outline-none font-bold">
                                    </div>
                                </div>

                                <!-- Change summary -->
                                <div class="bg-slate-900/60 rounded-lg p-3.5 border border-slate-700/60 space-y-1">
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-400 font-medium">Total to Pay (inc. tip):</span>
                                        <span class="font-bold text-white text-base" x-text="formatCurrency(totalACobrar)"></span>
                                    </div>
                                    <div x-show="metodoPago === 'efectivo'" class="flex justify-between text-sm pt-1 border-t border-slate-700/40">
                                        <span class="text-slate-400 font-medium">Change due:</span>
                                        <span class="font-bold font-mono" :class="cambio >= 0 ? 'text-green-400' : 'text-red-400'" x-text="formatCurrency(Math.max(0, cambio))"></span>
                                    </div>
                                </div>

                                <button type="button" @click="confirmarPago()" :disabled="submitting || (metodoPago === 'efectivo' && montoRecibido < totalACobrar)"
                                    class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white font-bold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                                    <svg x-show="submitting" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <span>Confirm Payment & Generate Electronic Invoice</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Toast -->
            <div x-show="toast.show" x-transition class="fixed top-4 right-4 z-50 rounded-lg px-4 py-3 shadow-lg border text-sm font-medium bg-green-900/90 border-green-500 text-green-200" style="display: none;">
                <p x-text="toast.message"></p>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js?v=5"></script>
    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/auth.js?v=5"></script>
    <script src="../assets/js/perfil.js?v=5"></script>
    <script src="../assets/js/factura.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.auth.getUser();
            if (!user) { window.location.href = '../index.html'; return; }
            if (!window.auth.hasRole('admin', 'cajero')) { window.location.href = 'dashboard.html'; return; }

            const rolNombre = user.rol_nombre || user.rol || '';
            const fullName = `${user.nombre} ${user.apellido || ''}`.trim();
            document.querySelectorAll('#user-name, .user-display-name').forEach(el => el.textContent = fullName);
            document.querySelectorAll('#user-rol, .user-display-rol').forEach(el => el.textContent = window.tRole ? window.tRole(rolNombre) : rolNombre);

            const rol = rolNombre.toLowerCase();
            if (rol === 'admin' || rol === 'cajero') {
                document.querySelectorAll('.nav-cajero, .nav-admin').forEach(el => el.style.display = 'flex');
            }
            if (rol === 'admin') {
                document.querySelectorAll('.nav-admin').forEach(el => el.style.display = 'flex');
                document.querySelectorAll('div.nav-admin').forEach(el => el.style.display = 'block');
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('pagosPage', () => ({
                sedes: [],
                selectedSedeId: '',
                ordenes: [],
                selectedOrder: null,
                propina: 0,
                metodoPago: 'efectivo',
                montoRecibido: 0,
                clienteNombre: 'Walk-in Customer',
                clienteDocumento: '222222222222',
                clienteTelefono: '',
                clienteEmail: '',
                submitting: false,
                toast: { show: false, message: '' },

                get isAdmin() {
                    return window.auth.hasRole('admin');
                },

                get currentSedeName() {
                    const s = this.sedes.find(item => String(item.id) === String(this.selectedSedeId));
                    return s ? s.nombre : 'Main Branch';
                },

                formatStatus(st) {
                    if (!st) return '';
                    return window.tStatus ? window.tStatus(st) : st.replace('_', ' ');
                },

                async init() {
                    await this.fetchSedes();
                    await this.fetchOrders();
                },

                async fetchSedes() {
                    try {
                        const res = await window.api.get('/api/sedes');
                        this.sedes = res?.data || [];
                        const user = window.auth.getUser();
                        
                        if (!this.isAdmin && user?.sede_id) {
                            this.selectedSedeId = user.sede_id;
                        } else if (user?.sede_id && this.sedes.some(s => String(s.id) === String(user.sede_id))) {
                            this.selectedSedeId = user.sede_id;
                        } else if (this.sedes.length > 0) {
                            this.selectedSedeId = this.sedes[0].id;
                        }
                    } catch(e) {
                        this.sedes = [];
                    }
                },

                async onSedeChange() {
                    this.selectedOrder = null;
                    await this.fetchOrders();
                },

                async fetchOrders() {
                    try {
                        let url = '/api/ordenes?estado=lista,en_proceso';
                        if (this.selectedSedeId) {
                            url += `&sede_id=${this.selectedSedeId}`;
                        }
                        const res = await window.api.get(url);
                        this.ordenes = res?.data || [];

                        if (this.selectedOrder) {
                            const updated = this.ordenes.find(o => o.id === this.selectedOrder.id);
                            if (updated) {
                                await this.selectOrder(updated);
                            } else {
                                this.selectedOrder = null;
                            }
                        }
                    } catch (e) {
                        this.ordenes = [];
                    }
                },

                async selectOrder(orden) {
                    try {
                        const res = await window.api.get(`/api/ordenes/${orden.id}`);
                        this.selectedOrder = res?.data || orden;
                    } catch (e) {
                        this.selectedOrder = orden;
                    }
                    this.propina = 0;
                    this.metodoPago = 'efectivo';
                    this.montoRecibido = parseFloat(this.selectedOrder.total || 0);
                    const cName = this.selectedOrder.cliente_nombre;
                    this.clienteNombre = (!cName || cName === 'Consumidor Final') ? 'Walk-in Customer' : cName;
                    this.clienteDocumento = this.selectedOrder.cliente_documento || '222222222222';
                    this.clienteTelefono = '';
                    this.clienteEmail = '';
                },

                get totalACobrar() {
                    const sub = parseFloat(this.selectedOrder?.total || 0);
                    const prop = parseFloat(this.propina || 0);
                    return sub + prop;
                },

                get cambio() {
                    const rec = parseFloat(this.montoRecibido || 0);
                    return rec - this.totalACobrar;
                },

                async confirmarPago() {
                    if (!this.selectedOrder) return;
                    this.submitting = true;
                    try {
                        const user = window.auth.getUser();
                        const payload = {
                            orden_id: this.selectedOrder.id,
                            metodo_pago: this.metodoPago,
                            cajero_id: user?.id || null,
                            monto_recibido: this.montoRecibido,
                            propina: this.propina,
                            cliente_nombre: this.clienteNombre || 'Walk-in Customer',
                            cliente_documento: this.clienteDocumento || '222222222222',
                            cliente_telefono: this.clienteTelefono || '',
                            cliente_email: this.clienteEmail || ''
                        };
                        const res = await window.api.post('/api/pagos', payload);
                        const pagoData = res?.data || {};

                        this.showToast('Payment recorded successfully');
                        this.selectedOrder = null;
                        await this.fetchOrders();

                        if (window.openFacturaModal) {
                            window.openFacturaModal(pagoData.numero_comprobante || pagoData.id);
                        }
                    } catch (e) {
                        alert(e.message || 'Error processing payment');
                    } finally {
                        this.submitting = false;
                    }
                },

                formatCurrency(val) {
                    const num = parseFloat(val) || 0;
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(num);
                },

                showToast(message) {
                    this.toast = { show: true, message };
                    setTimeout(() => { this.toast.show = false; }, 4000);
                }
            }));
        });
    </script>
</body>
</html>
